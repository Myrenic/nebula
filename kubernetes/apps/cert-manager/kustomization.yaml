apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./cert-manager
  # The issuers are their own Flux Kustomization on purpose: the ClusterIssuers
  # have to exist before the routes that reference them, and they need the
  # cluster-secrets substitution that the cert-manager chart itself does not.
  - ./issuers
