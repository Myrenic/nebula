# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One directory per namespace, sorted alphabetically so that adding a namespace
# does not also decide where in the list it lands. Each one carries its own
# namespace.yaml, whatever is applied straight from this root (the
# cluster-secrets Secret, the vendored Traefik CRDs) and one Flux Kustomization
# per app.
resources:
  - ./auth
  - ./backup
  - ./cert-manager
  - ./common
  - ./flux-system
  - ./frigate
  - ./monitoring
  - ./network
  - ./services
  - ./storage
