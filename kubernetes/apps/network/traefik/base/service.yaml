---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: network
  annotations:
    metallb.io/loadBalancerIPs: 10.0.50.4
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: websecure
      port: 443
      targetPort: 443
  selector:
    app: traefik
