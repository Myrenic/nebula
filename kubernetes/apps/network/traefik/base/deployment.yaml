apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: network
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # With two replicas and maxUnavailable: 0 an update never takes a Traefik
      # down: the new one joins first, the old one leaves after.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-sa
      # Give open connections time to finish before the pod goes away.
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: traefik
      containers:
        - name: traefik
          image: traefik:v3.7.13
          args:
            - --log.level=INFO
            - --log.format=json
            - --api.dashboard=true
            - --entrypoints.web.address=:80
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.websecure.address=:443
            - --providers.kubernetescrd
            - --providers.kubernetescrd.allowCrossNamespace=true
            - --accesslog=true
            # 4xx-only was too narrow: every 5xx - the upstream failures this
            # cluster actually debugs - was filtered out of the access log,
            # which made the filter look like a deliberate error-only choice
            # while hiding the errors that matter most.
            - --accesslog.filters.statuscodes=400-599
            - --accesslog.format=json
            # /ping on the internal traefik port (8080) so the probes can tell
            # whether Traefik is actually alive. There were no probes at all
            # before this, which meant a stuck proxy kept receiving traffic.
            - --ping=true
          ports:
            - containerPort: 80
              name: web
            - containerPort: 443
              name: websecure
            - containerPort: 8080
              name: traefik
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
            initialDelaySeconds: 20
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                # Let the endpoint leave the service endpoints before the
                # container stops.
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # This was runAsNonRoot: false with the rationale that Traefik binds
            # :80 and :443. It does not need root for that: Kubernetes sets
            # net.ipv4.ip_unprivileged_port_start=0 in every pod netns (checked
            # in the running pod), and the image has nobody (65534) with no
            # dedicated traefik account. The ingress pod is the one exposed to
            # untrusted input, so it is the last place to leave root.
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
