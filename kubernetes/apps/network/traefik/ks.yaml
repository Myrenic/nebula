apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  targetNamespace: network
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  force: true
  path: ./kubernetes/apps/network/traefik/base
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
    # The Service is a LoadBalancer with a pinned MetalLB address; without the
    # pool the API server rejects it (or it never leaves Pending).
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  dependsOn:
    - name: cert-manager-issuers
    - name: metallb-pool
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: traefik
      namespace: network
