# Stalker -> Stremio addon. No oauth2-proxy here: Stremio fetches the manifest,
# catalogs and streams without auth headers, so it is restricted to the LAN by
# source address instead.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stalker-stremio
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`stalker.${SECRET_DOMAIN_0}`)
      kind: Rule
      middlewares:
        # Unqualified on purpose: the middlewares live in this namespace, and
        # every other route here relies on that. Only the service references
        # carry a namespace, because those really are elsewhere.
        - name: lan-only
      services:
        - name: stalker-stremio
          namespace: services
          port: 7000
  tls:
    secretName: domain-0-prod-tls
