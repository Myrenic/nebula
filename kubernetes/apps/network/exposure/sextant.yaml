apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sextant
  namespace: network
  annotations:
    # Public by design, for the same reason the forge is: Sextant is itself an
    # OIDC client of the realm oauth2-proxy authenticates against, and its role
    # model is derived from the `groups` claim Keycloak returns. Putting
    # oauth2-proxy in front would authenticate twice and grant nothing - the
    # console would still need its own login to know who owns what - so the
    # console's own Keycloak login is the gate here.
    testlab.io/exposure: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sextant.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: sextant
          namespace: sextant
          port: 80
  tls:
    secretName: domain-0-prod-tls
