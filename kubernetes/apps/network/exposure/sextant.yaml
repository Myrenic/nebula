apiVersion: v1
kind: Service
metadata:
  name: sextant
  namespace: network
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080

---
# The console does not run in this cluster: it is LXC 110 on the Proxmox host
# (10.0.50.72), because it needs its own Postgres and a git working tree and
# none of that wants to be a pod. This endpoint is how a machine outside the
# cluster is reachable through the same Traefik that serves every other host
# here - the same shape as homeassistant.yaml.
apiVersion: v1
kind: Endpoints
metadata:
  name: sextant
  namespace: network
subsets:
  - addresses:
      - ip: 10.0.50.72
    ports:
      - name: http
        port: 8080
        protocol: TCP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sextant
  namespace: network
  annotations:
    # Public by design, like the forge: the console is its own OIDC client
    # against realm nebula, so an oauth2-proxy in front of it would be a second
    # login asking for the same account. Everything past the login is resolved
    # by Sextant's own roles from the `groups` claim.
    testlab.io/exposure: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sextant.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: sextant
          namespace: network
          port: 8080
  tls:
    secretName: domain-0-prod-tls
