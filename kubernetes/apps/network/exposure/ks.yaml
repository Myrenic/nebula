apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingressroutes
  namespace: flux-system
spec:
  targetNamespace: network
  interval: 1h
  retryInterval: 1m
  timeout: 3m
  prune: true
  path: ./kubernetes/apps/network/exposure
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  dependsOn:
    - name: cert-manager-issuers
