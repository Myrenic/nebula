# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# This directory is the cluster's entire public surface: one file per host, plus
# the shared middlewares, the wildcard certificate and the external endpoints that
# point at machines outside the cluster. CI enforces that every route here is
# either behind an auth middleware or explicitly marked public with a reason.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./aiostreams.yaml
  - ./certificate.yaml
  - ./flux-operator.yaml
  - ./forgejo.yaml
  - ./frigate.yaml
  - ./glance.yaml
  - ./grafana.yaml
  - ./homeassistant.yaml
  - ./keycloak.yaml
  - ./longhorn.yaml
  - ./lucian.yaml
  - ./middlewares.yaml
  - ./mushroom-finder.yaml
  - ./oauth2-proxy.yaml
  - ./open-webui.yaml
  - ./searxng.yaml
  - ./sextant.yaml
  - ./spottarr.yaml
  - ./stalker-stremio.yaml
  - ./traefik.yaml
  - ./uptime-kuma.yaml
