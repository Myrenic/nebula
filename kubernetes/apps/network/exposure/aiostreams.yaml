apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aiostreams
  namespace: network
  annotations:
    # Public by design: Stremio addon URLs are fetched by media clients that cannot do OIDC.
    testlab.io/exposure: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`aiostreams.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: aiostreams
          namespace: services
          port: 3000
  tls:
    secretName: domain-0-prod-tls
