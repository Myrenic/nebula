apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aiostreams
  namespace: network
  annotations:
    # Public by design, and gated by the app rather than by a proxy: Stremio
    # media clients fetch addon URLs and cannot do an OIDC dance, so the addon
    # answers with its own credentials instead (`AIOSTREAMS_AUTH*` and
    # `AIOSTREAM_ADDON_PASSWORD` in cluster-secrets, `AIOSTREAMS_AUTH_REQUIRED:
    # "true"` in the HelmRelease). "The client cannot do OIDC" on its own would
    # not be a reason to publish anything - the reason here is that the app has
    # its own gate.
    testlab.io/exposure: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`aiostreams.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: aiostreams
          namespace: services
          port: 3000
  tls:
    secretName: domain-0-prod-tls
