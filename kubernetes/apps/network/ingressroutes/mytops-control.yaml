# Network-namespace half of the mytops control RBAC: allows the webui's
# kubectl-proxy sidecar (SA mytops-control in services) to create/delete the
# per-user IngressRoutes that route to per-user workspace pods. Lives here
# because the mytops Kustomization forces targetNamespace=services.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mytops-control
  namespace: network
rules:
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mytops-control
  namespace: network
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mytops-control
subjects:
  - kind: ServiceAccount
    name: mytops-control
    namespace: services
