apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nzbdav
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nzbdav.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: nzbdav
          namespace: services
          port: 3000
  tls:
    secretName: domain-0-prod-tls
