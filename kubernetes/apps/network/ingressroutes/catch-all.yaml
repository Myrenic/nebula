apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catch-all
  namespace: network
  annotations:
    # Public by design: fallback handler for unknown hosts. It has no
    # backend service, it only redirects.
    testlab.io/exposure: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`.+`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-to-youtube
          namespace: network
      services:
        - kind: TraefikService
          name: api@internal
  tls: {}
