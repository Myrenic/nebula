apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spottarr
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`spottarr.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: spottarr
          namespace: services
          port: 8383
  tls:
    secretName: domain-0-prod-tls
