apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prowlarr.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: prowlarr
          namespace: services
          port: 9696
  tls:
    secretName: domain-0-prod-tls
