apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: uptime-kuma
          namespace: services
          port: 3001
  tls:
    secretName: domain-0-prod-tls
