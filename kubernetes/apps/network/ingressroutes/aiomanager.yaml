apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aiomanager
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`aiomanager.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: aiomanager
          namespace: services
          port: 1610
  tls:
    secretName: domain-0-prod-tls
