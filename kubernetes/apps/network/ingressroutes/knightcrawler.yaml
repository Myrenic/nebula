apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: knightcrawler
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`knightcrawler.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: knightcrawler
          namespace: services
          port: 7000
  tls:
    secretName: domain-0-prod-tls
