# ChACDN web launcher
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chacdn-webui
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`apps.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: chacdn-webui
          namespace: services
          port: 80
  tls:
    secretName: domain-0-prod-tls
---
# Example Selkies desktops. Traefik proxies HTTP port 3000 and passes through
# the /websocket stream upgrade used by the Selkies client.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: desktop-ubuntu
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`desktop-ubuntu.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: desktop-ubuntu
          namespace: services
          port: 3000
  tls:
    secretName: domain-0-prod-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: desktop-fedora
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`desktop-fedora.${SECRET_DOMAIN_0}`)
