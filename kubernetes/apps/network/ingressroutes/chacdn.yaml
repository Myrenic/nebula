# ChACDN web launcher
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chacdn-webui
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    # Control channel for the SPA -> kubectl-proxy sidecar.
    - match: Host(`apps.${SECRET_DOMAIN_0}`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: oauth2-proxy-auth
          namespace: network
      services:
        - name: chacdn-webui
          namespace: services
          port: api
    - match: Host(`apps.${SECRET_DOMAIN_0}`)
      kind: Rule
      middlewares:
        - name: oauth2-proxy-auth
          namespace: network
      services:
        - name: chacdn-webui
          namespace: services
          port: 80
  tls:
    secretName: domain-0-prod-tls
