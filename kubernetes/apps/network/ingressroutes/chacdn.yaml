# ChACDN web launcher
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chacdn-webui
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    # SPA + /api (nginx proxies /api/ to the workplace-api sidecar).
    # Do not route /api to the kubectl-proxy port — that would expose the
    # raw Kubernetes API.
    - match: Host(`apps.${SECRET_DOMAIN_0}`)
      kind: Rule
      middlewares:
        - name: oauth2-proxy-auth
          namespace: network
      services:
        - name: chacdn-webui
          namespace: services
          port: 80
  tls:
    secretName: domain-0-prod-tls
