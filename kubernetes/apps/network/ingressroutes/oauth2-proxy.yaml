apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oauth2-proxy
  namespace: network
  annotations:
    # Public by design: sign-in/sign-out endpoints and the session cookie exchange.
    testlab.io/exposure: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: oauth2-proxy
          namespace: auth
          port: 80
  tls:
    secretName: domain-0-prod-tls

