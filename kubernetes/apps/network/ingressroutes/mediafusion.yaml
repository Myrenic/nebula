apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediafusion
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mediafusion.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: mediafusion
          namespace: services
          port: 8000
  tls:
    secretName: domain-0-prod-tls
