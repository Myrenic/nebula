apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frigate
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`frigate.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: frigate
          namespace: services
          port: 8971
  tls:
    secretName: domain-0-prod-tls
