apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: network
  annotations:
    # Public by design: OIDC discovery/authorize/token endpoints for every login in this cluster.
    testlab.io/exposure: public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`keycloak.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: keycloak
          namespace: auth
          port: 8080
  tls:
    secretName: domain-0-prod-tls
