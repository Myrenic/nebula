# Guacamole RDP gateway
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: guacamole
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rdp.${SECRET_DOMAIN_0}`)
      kind: Rule
      middlewares:
        - name: oauth2-proxy-auth
          namespace: network
      services:
        - name: guacamole
          namespace: guacamole
          port: http
  tls:
    secretName: domain-0-prod-tls
