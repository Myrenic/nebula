apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediaflow-proxy
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mediaflow-proxy.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: mediaflow-proxy
          namespace: services
          port: 8888
  tls:
    secretName: domain-0-prod-tls
