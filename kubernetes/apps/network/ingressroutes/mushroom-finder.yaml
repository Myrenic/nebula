# Mushroom Finder: openbare, alleen-lezen kaart. Geen authenticatie nodig,
# er valt niets te wijzigen en de gegevens zijn al openbaar.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mushroom-finder
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mushrooms.${SECRET_DOMAIN_0}`)
      kind: Rule
      # Openbaar: geen oauth2-proxy meer. De app is alleen-lezen, toont geen
      # exacte vindplaatsen en wordt per IP afgeremd.
      services:
        - name: mushroom-finder
          namespace: services
          port: 80
  tls:
    secretName: domain-0-prod-tls
