# Mushroom Finder — private household app (Keycloak login via oauth2-proxy).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mushroom-finder
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mushrooms.${SECRET_DOMAIN_0}`)
      kind: Rule
      middlewares:
        - name: oauth2-proxy-auth
          namespace: network
      services:
        - name: mushroom-finder
          namespace: services
          port: 80
  tls:
    secretName: domain-0-prod-tls
