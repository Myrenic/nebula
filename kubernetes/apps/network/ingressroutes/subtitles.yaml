apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: subtitles
  namespace: network
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`subtitles.${SECRET_DOMAIN_0}`)
      kind: Rule
      services:
        - name: subtitles
          namespace: services
          port: 4949
  tls:
    secretName: domain-0-prod-tls
