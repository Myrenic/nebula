apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aiostreams
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: aiostreams
  values:
    controllers:
      aiostreams:
        containers:
          app:
            image:
              repository: ghcr.io/viren070/aiostreams
              tag: latest
            envFrom:
              - secretRef:
                  name: aiostreams-secret
            env:
              TZ: "${TZ}"
              ADDON_NAME: "AIOStreams"
              ADDON_ID: "aiostreams.${SECRET_DOMAIN_0}"
              PORT: "3000"
              BASE_URL: "https://aiostreams.${SECRET_DOMAIN_0}"
              SECRET_KEY: "${AIOSTREAM_SECRET_KEY}"
              ADDON_PASSWORD: "${AIOSTREAM_ADDON_PASSWORD}"
              DATABASE_URI: "sqlite://./data/db.sqlite"
              LOG_LEVEL: "http"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 3000
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /app/data
