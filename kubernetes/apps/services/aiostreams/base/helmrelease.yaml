apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aiostreams
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: aiostreams
  values:
    controllers:
      aiostreams:
        containers:
          app:
            image:
              repository: ghcr.io/viren070/aiostreams
              # Pinned. `latest` pointed at exactly this release (same digest), so
              # this changes nothing that is running; it only makes the version
              # visible and updatable by Renovate.
              tag: v2.35.7
            # Every credential comes from `cluster-secrets` through the
            # Kustomization's postBuild substitution, so there is exactly one
            # place a value can live. There used to be a second copy here as an
            # encrypted Secret mounted with envFrom, which was worse than
            # redundant: that Kustomization never carried a `decryption:` block,
            # so what landed in the cluster was the literal ciphertext
            # (`SECRET_KEY=ENC[AES256_GCM,...]`). It stayed invisible only
            # because these inline values win over envFrom.
            env:
              TZ: "${TZ}"
              ADDON_NAME: "AIOStreams"
              ADDON_ID: "aiostreams.${SECRET_DOMAIN_0}"
              PORT: "3000"
              BASE_URL: "https://aiostreams.${SECRET_DOMAIN_0}"
              SECRET_KEY: "${AIOSTREAM_SECRET_KEY}"
              ADDON_PASSWORD: "${AIOSTREAM_ADDON_PASSWORD}"
              AIOSTREAMS_AUTH: "${AIOSTREAMS_AUTH}"
              AIOSTREAMS_AUTH_REQUIRED: "true"
              DATABASE_URI: "sqlite://./data/db.sqlite"
              LOG_LEVEL: "http"
            # `/api/v1/health` answers 200 without credentials, verified through
            # the ingress on 2026-10-02 (the bare /health, /healthz and
            # /api/health paths all answer 404, and the image is distroless
            # enough that there is no shell to poke at it locally). Without a
            # probe this container had none at all: a wedged process kept
            # receiving the family's addon requests and nothing noticed.
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  initialDelaySeconds: 5
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 20
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 3000
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /app/data
