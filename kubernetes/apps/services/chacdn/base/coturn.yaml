# TURN for WebRTC media. KubeVirt VM adapters only have masquerade'd pod IPs,
# which the browser cannot reach, so media must relay through coturn (also
# usable as STUN). hostNetwork on the workspace node: the browser reports to
# <node IP>:3478/udp directly (it never crosses the ingress). Media relays
# UDP 61000-65535 to stay clear of the host's ephemeral port range.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chacdn-coturn
  namespace: services
  labels:
    app.kubernetes.io/name: chacdn
    app.kubernetes.io/component: turn
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chacdn
      app.kubernetes.io/component: turn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chacdn
        app.kubernetes.io/component: turn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      nodeSelector:
        kubernetes.io/hostname: talos-45w-c87
      containers:
        - name: coturn
          image: docker.io/coturn/coturn:4.18.0
          command:
            - /bin/sh
            - -c
            - >-
              exec turnserver
              --no-cli
              --listening-port="$TURN_PORT"
              --listening-ip=0.0.0.0
              --fingerprint
              --realm=tuntelder.com
              --use-auth-secret
              --static-auth-secret="$TURN_SHARED_SECRET"
              --no-tls
              --no-dtls
              --min-port=61000
              --max-port=65535
          env:
            - name: TURN_PORT
              valueFrom:
                secretKeyRef:
                  name: chacdn-turn
                  key: TURN_PORT
            - name: TURN_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: chacdn-turn
                  key: TURN_SHARED_SECRET
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              # turnserver binary has file caps; dropping the bounding set
              # entirely makes exec() fail with EPERM.
              add: ["NET_BIND_SERVICE", "TO_PORTS"]
            seccompProfile:
              type: RuntimeDefault
