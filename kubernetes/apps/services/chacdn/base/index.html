<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChACDN — Apps &amp; Desktops</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #22262f;
    --border: #2c323d;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-2: #39d98a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #18202e 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 28px 24px 12px;
    max-width: 1080px;
    margin: 0 auto;
  }
  header h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .controls {
    max-width: 1080px;
    margin: 16px auto 20px;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  input[type=search] {
    flex: 1 1 260px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input[type=search]:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .chip.active { color: var(--text); border-color: var(--accent); background: #1b2740; }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform .08s ease, border-color .08s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .icon {
    width: 52px; height: 52px;
    border-radius: 12px;
    background: var(--panel-2);
    display: grid;
    place-items: center;
    font-size: 28px;
  }
  .card h3 { margin: 0; font-size: 15px; }
  .card p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; flex: 1; }
  .meta { display: flex; justify-content: space-between; align-items: center; }
  .badge {
    font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
  }
  .badge.desktop { background: #10281e; color: var(--accent-2); }
  .badge.app { background: #1b2740; color: var(--accent); }
  .connect {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 0;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  .connect:hover { filter: brightness(1.08); }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>Ch<span>ACDN</span></h1>
  <p>Container apps &amp; desktops, right in your browser.</p>
</header>

<div class="controls">
  <input id="search" type="search" placeholder="Search apps and desktops…" autocomplete="off">
  <div class="chips" id="chips"></div>
</div>

<main id="grid"></main>

<script>
  const state = { items: [], filter: "all", q: "" };

  const TYPES = [
    { id: "all", label: "All" },
    { id: "desktop", label: "Desktops" },
    { id: "app", label: "Apps" }
  ];

  async function load() {
    const res = await fetch("catalog.json", { cache: "no-store" });
    const data = await res.json();
    state.items = Array.isArray(data.apps) ? data.apps : [];
    renderChips();
    render();
  }

  function renderChips() {
    const chips = document.getElementById("chips");
    chips.innerHTML = "";
    for (const t of TYPES) {
      const el = document.createElement("button");
      el.className = "chip" + (t.id === state.filter ? " active" : "");
      el.textContent = t.label;
      el.onclick = () => { state.filter = t.id; renderChips(); render(); };
      chips.appendChild(el);
    }
  }

  function render() {
    const grid = document.getElementById("grid");
    const q = state.q.toLowerCase();
    const list = state.items.filter(it =>
      (state.filter === "all" || it.type === state.filter) &&
      (!q || (it.name + " " + it.description).toLowerCase().includes(q))
    );
    grid.innerHTML = "";
    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nothing here. Add apps/desktops to the catalog to see them.";
      grid.appendChild(empty);
      return;
    }
    for (const it of list) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="icon">${it.icon || "🖥️"}</div>
        <h3>${it.name}</h3>
        <p>${it.description || ""}</p>
        <div class="meta">
          <span class="badge ${it.type}">${it.type}</span>
        </div>
        <a class="connect" href="${it.url}" target="_blank" rel="noopener">Connect</a>`;
      grid.appendChild(card);
    }
  }

  document.getElementById("search").addEventListener("input", e => {
    state.q = e.target.value;
    render();
  });

  load().catch(err => {
    document.getElementById("grid").innerHTML =
      `<div class="empty">Could not load catalog.json: ${err.message}</div>`;
  });
</script>
</body>
</html>
