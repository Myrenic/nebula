apiVersion: apps/v1
kind: Deployment
metadata:
  name: chacdn-webui
  namespace: services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chacdn-webui
  template:
    metadata:
      labels:
        app: chacdn-webui
    spec:
      serviceAccountName: chacdn-control
      containers:
        - name: webui
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: webui
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        # Proxies the Kubernetes API (RBAC-scoped to the chacdn-control
        # ServiceAccount) so the SPA can roll a fresh workspace pod.
        - name: kubectl-proxy
          image: alpine/k8s:1.36.0
          command: ["kubectl", "proxy", "--port=8001", "--address=0.0.0.0", "--disable-filter=true"]
          ports:
            - name: api
              containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: webui
          configMap:
            name: chacdn-webui
        - name: nginx-conf
          configMap:
            name: chacdn-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chacdn-webui
  namespace: services
spec:
  selector:
    app: chacdn-webui
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: api
      port: 8001
      targetPort: api