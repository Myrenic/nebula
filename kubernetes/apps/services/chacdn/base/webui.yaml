apiVersion: apps/v1
kind: Deployment
metadata:
  name: chacdn-webui
  namespace: services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chacdn-webui
  template:
    metadata:
      labels:
        app: chacdn-webui
    spec:
      serviceAccountName: chacdn-control
      containers:
        - name: webui
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: webui
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        # Workplace API: validates requests server-side, enforces group ACL,
        # builds manifests, and provisions workspace resources via the
        # kubectl-proxy sidecar.  The browser never touches the K8s API.
        - name: workplace-api
          image: docker.io/library/node:22-alpine
          command: ["node", "/etc/chacdn-api/server.mjs"]
          ports:
            - name: workplace
              containerPort: 3001
          env:
            - name: KUBE_API
              value: "http://localhost:8001"
            - name: WORKSPACE_NAMESPACE
              value: "services"
            - name: CATALOG_PATH
              value: "/etc/chacdn/catalog.json"
          volumeMounts:
            - name: api-catalog
              mountPath: /etc/chacdn
              readOnly: true
            - name: api-code
              mountPath: /etc/chacdn-api
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: workplace
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # Proxies the Kubernetes API (RBAC-scoped to the chacdn-control
        # ServiceAccount) so the workplace-api can provision workspace pods.
        - name: kubectl-proxy
          image: alpine/k8s:1.36.0
          command: ["kubectl", "proxy", "--port=8001", "--address=0.0.0.0", "--disable-filter=true"]
          ports:
            - name: api
              containerPort: 8001
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: webui
          configMap:
            name: chacdn-webui
        - name: nginx-conf
          configMap:
            name: chacdn-nginx
        - name: api-catalog
          configMap:
            name: chacdn-api-catalog
        - name: api-code
          configMap:
            name: chacdn-workplace-api
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chacdn-webui
  namespace: services
spec:
  selector:
    app: chacdn-webui
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: workplace
      port: 3001
      targetPort: workplace