# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./webui.yaml
  - ./desktops.yaml
configMapGenerator:
  - name: chacdn-webui
    files:
      - index.html
      - catalog.json
    options:
      disableNameSuffixHash: true