# Scoped ServiceAccount for the webui's kubectl-proxy sidecar. Only allows
# reading and rolling workspace Deployments in this namespace, so the "Restart"
# button in the UI can recreate a fresh pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chacdn-control
  namespace: services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chacdn-control
  namespace: services
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chacdn-control
  namespace: services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chacdn-control
subjects:
  - kind: ServiceAccount
    name: chacdn-control
    namespace: services