# Custom nginx config for the webui: SPA fallback, /me identity endpoint
# (oauth2-proxy SSI), and /api proxy to the workplace-api sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chacdn-nginx
  namespace: services
data:
  default.conf: |
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Workplace API: server-side validated workspace provisioning.
        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Identity for the SPA: oauth2-proxy (set-xauthrequest) injects
        # X-Auth-Request-Email/Groups, SSI echoes them as JSON.
        location = /me {
            ssi on;
            ssi_types *;
            default_type application/json;
        }
    }