apiVersion: batch/v1
kind: CronJob
metadata:
  name: chacdn-idle-culler
  namespace: services
  labels:
    app.kubernetes.io/name: chacdn
    app.kubernetes.io/component: idle-culler
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: chacdn
            app.kubernetes.io/component: idle-culler
        spec:
          serviceAccountName: chacdn-control
          restartPolicy: Never
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cull
              # alpine/k8s instead of plain alpine: the script shells out to
              # kubectl, which the alpine image does not ship. It also has
              # /bin/sh, which is all the script needs.
              image: alpine/k8s:1.36.0
              # The script is base64-encoded in a ConfigMap (binaryData): the
              # chacdn kustomization postBuild envsubst removes unknown shell
              # vars from inline text, which previously corrupted the script
              # body. binaryData is opaque to substitution.
              command:
                - /bin/sh
                - -c
                - 'base64 -d /etc/cull/cull.sh > /tmp/cull.sh && /bin/sh /tmp/cull.sh'
              env:
                - name: MAX_LIFETIME_MINUTES
                  value: "480"
              volumeMounts:
                - name: script
                  mountPath: /etc/cull
                  readOnly: true
                # readOnlyRootFilesystem is on, so the decoded script needs a
                # writable place: without this the job died with
                # "can't create /tmp/cull.sh: Read-only file system" every run.
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          volumes:
            - name: script
              configMap:
                name: chacdn-idle-culler-script
            - name: tmp
              emptyDir: {}
