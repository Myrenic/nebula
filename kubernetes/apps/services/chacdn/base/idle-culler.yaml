apiVersion: batch/v1
kind: CronJob
metadata:
  name: chacdn-idle-culler
  namespace: services
  labels:
    app.kubernetes.io/name: chacdn
    app.kubernetes.io/component: idle-culler
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: chacdn
            app.kubernetes.io/component: idle-culler
        spec:
          serviceAccountName: chacdn-control
          restartPolicy: Never
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cull
              # alpine/k8s instead of plain alpine: the script shells out to
              # kubectl, which the alpine image does not ship. It also has
              # /bin/sh, which is all the script needs.
              image: alpine/k8s:1.36.0
              # The script lives in the ConfigMap's binaryData (base64), which
              # is opaque to the chacdn kustomization's postBuild envsubst -
              # inline text in ConfigMap data had its ${VAR} shell variables
              # eaten, which is why it is encoded at all. Kubernetes decodes
              # binaryData when it writes the mounted file, so the container
              # runs the script straight from the mount.
              command:
                - /bin/sh
                - /etc/cull/cull.sh
              env:
                - name: MAX_LIFETIME_MINUTES
                  value: "480"
              volumeMounts:
                - name: script
                  mountPath: /etc/cull
                  readOnly: true
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
          volumes:
            - name: script
              configMap:
                name: chacdn-idle-culler-script
