# Destroy hardens the VM disk teardown: PVC delete + Longhorn volume delete.
# The longhorn StorageClass is retainPolicy: Retain (cluster-wide setting,
# not changing it) — so a deleted PVC leaves the volume object behind unless
# the destroy path removes volumes.longhorn.io explicitly after the PVC is
# released. Scoped to deleting volume CRDs only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chacdn-longhorn-volumes
  namespace: longhorn-system
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chacdn-longhorn-volumes
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chacdn-longhorn-volumes
subjects:
  - kind: ServiceAccount
    name: chacdn-control
    namespace: services