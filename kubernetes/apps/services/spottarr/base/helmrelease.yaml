apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spottarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: spottarr
  values:
    controllers:
      spottarr:
        containers:
          app:
            image:
              repository: ghcr.io/spottarr/spottarr
              # Pinned. `latest` was this release (identical digest).
              tag: 1.20.0
            env:
              USENET__HOSTNAME: "nl.newsdemon.com"
              USENET__USERNAME: "${SPOTTARR_USENET_USERNAME}"
              USENET__PASSWORD: "${SPOTTARR_USENET_PASSWORD}"
              USENET__PORT: "563"
              USENET__USETLS: "true"
              USENET__MAXCONNECTIONS: "10"
              SPOTNET__RETRIEVEAFTER: "2024-10-01T00:00:00Z"
              SPOTNET__IMPORTBATCHSIZE: "10000"
              SPOTNET__RETENTIONDAYS: "365"
              SPOTNET__IMPORTADULTCONTENT: "true"
              TZ: "${TZ}"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              # /healthz is the endpoint Spottarr itself maps
              # (app.MapHealthChecks("/healthz") in Spottarr.Web/Program.cs),
              # not a guess. A first start migrates the SQLite database before
              # the server listens, so the startup probe carries the long budget
              # and liveness does not begin until it has passed.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8383
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8383
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8383
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              # The only path it writes to is /data (the SQLite database);
              # verified by running 1.20.0 with --read-only and just that mount
              # - it migrates, listens and answers /healthz.
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 8383
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /data
