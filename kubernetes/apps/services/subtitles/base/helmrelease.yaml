apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: subtitles
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: subtitles
  values:
    controllers:
      subtitles:
        containers:
          app:
            image:
              repository: ghcr.io/skoruppa/stremio-community-subtitles
              tag: latest
            env:
              FLASK_ENV: "production"
              FLASK_RUN_PORT: "4949"
              SECRET_KEY: "${SUBTITLES_SECRET_KEY}"
              DISABLE_EMAIL_VERIFICATION: "true"
              PREFERRED_URL_SCHEME: "https"
              TMDB_API_KEY: "${AIOMETADATA_TMDB_API}"
              DATABASE_URL: "mysql+aiomysql://stremio:${SUBTITLES_DB_PASSWORD}@subtitles-db:3306/stremio_subs"
              TZ: "${TZ}"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 4949
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /app/data
      logs:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /app/logs
      subtitles:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteMany
        size: 20Gi
        globalMounts:
          - path: /app/subtitles
