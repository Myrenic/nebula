apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: open-webui
  values:
    controllers:
      open-webui:
        initContainers:
          # The image bakes the RAG embedding, whisper and tiktoken caches into
          # /app/backend/data (see its Dockerfile), and the volume mount below
          # would hide them. Upstream's chart copies them into the volume for the
          # same reason: without this the first embedding call downloads ~90 MB
          # from Hugging Face into the volume, and speech-to-text ~150 MB more.
          copy-app-data:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.4
            # `/.` rather than `/*`: an empty source directory copies fine
            # instead of failing the glob.
            command:
              - sh
              - -c
              - cp -R -n /app/backend/data/. /tmp/app-data/
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.4
            env:
              TZ: "${TZ}"
              WEBUI_URL: "https://chat.${SECRET_DOMAIN_0}"
              # Session signing key and the model provider's API key, substituted
              # from cluster-secrets by Flux's postBuild. They are deliberately NOT
              # in a *.sops.yaml file next to this manifest: app-level SOPS files
              # are applied as ciphertext in this cluster (only the root
              # Kustomization carries spec.decryption), which is easy to miss
              # because it looks like an opaque token - aiostreams' own secret
              # lands that way and is only harmless because its `env:` overrides
              # its `envFrom:`).
              WEBUI_SECRET_KEY: "${OPENWEBUI_SECRET_KEY}"
              OPENAI_API_KEYS: "${COMMANDCODE_API_KEY}"
              # The image sets HOME=/root, which only root owns; the app writes
              # its cache and telemetry marker under $HOME, so as uid 1000 it has
              # to point into the volume.
              HOME: "/app/backend/data"
              # Same reason: at import Open WebUI empties its static directory and
              # re-copies the frontend bundle into it, and admin branding
              # (custom.css, logo) is written there too. In the image that
              # directory belongs to root, so as uid 1000 every one of those
              # copies logs a permission error. Pointing it into the volume gives
              # the app the writable directory it expects.
              STATIC_DIR: "/app/backend/data/static"
              ENABLE_OPENAI_API: "true"
              # There is no Ollama anywhere in this cluster. Left at its default
              # the UI would list a connection that always answers with an error.
              ENABLE_OLLAMA_API: "false"
              # commandcode.ai's OpenAI-compatible endpoint - the same provider
              # the opencode/Oh My Pi tooling on the workstation uses. The key
              # is in open-webui-secret.
              OPENAI_API_BASE_URLS: "https://api.commandcode.ai/provider/v1"
              # Public host, so registration stays shut: auths.signup only
              # checks ENABLE_SIGNUP once a user exists, and the first account is
              # the admin that gets created on the first visit.
              ENABLE_SIGNUP: "false"
              ENABLE_INITIAL_ADMIN_SIGNUP: "true"
              WEBUI_SESSION_COOKIE_SECURE: "true"
              # The default is '*', which Open WebUI itself warns about at
              # startup. The web client and the phone PWA are same-origin, so
              # only the host that serves them needs to be allowed.
              CORS_ALLOW_ORIGIN: "https://chat.${SECRET_DOMAIN_0}"
              # Answers come from the web, not only from training data. With the
              # default function_calling=native the model decides when to search:
              # it calls the built-in web_search tool, can call it again for a
              # follow-up it just thought of, and the pages it finds are read into
              # context - one search is a lookup, several in a row is research.
              ENABLE_WEB_SEARCH: "true"
              # Keyless: the image ships ddgs, so there is nothing to run and
              # nothing to sign up for. Every other engine here (Brave, Tavily,
              # Serper, Google PSE, Kagi...) needs an account, or a self-hosted
              # SearXNG, which would be the upgrade if DuckDuckGo starts
              # rate-limiting this address.
              WEB_SEARCH_ENGINE: "duckduckgo"
              WEB_SEARCH_RESULT_COUNT: "5"
              # By default the fetched pages are chunked, embedded and top-k
              # retrieved locally first. Skipping that puts them in the context
              # window instead: better answers, and one less CPU-bound step per
              # search - the models in use have the room for it.
              BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "true"
              # Titles, tags, follow-up questions and search queries are model
              # calls of their own. Keep them on the fast model so the chat model
              # picked for a conversation is only paid for the answers.
              TASK_MODEL_EXTERNAL: "gpt-5.6-luna"
              # Model pre-selected in a new chat, so the phone opens ready to
              # type instead of asking which model to use.
              DEFAULT_MODELS: "gpt-5.6-terra"
              # Dictation works offline: faster-whisper "base" is baked into the
              # image and copied into the volume, so the microphone button on the
              # phone ships audio nowhere.
              AUDIO_STT_ENGINE: "local"
              # Nothing here belongs in a public prompt gallery, and the button
              # phones home.
              ENABLE_COMMUNITY_SHARING: "false"
              # The embedding model is already in the image: the boot-time update
              # check is a Hugging Face round trip for something nothing needs.
              RAG_EMBEDDING_MODEL_AUTO_UPDATE: "false"
              # Server settings live in this file, not in webui.db. Open WebUI's
              # default is the opposite: the first start seeds every env default
              # into a config table and every later env change is ignored, which
              # is how "I edited the manifest and nothing happened" happens (it
              # happened here - the web search defaults were already frozen before
              # this block existed). Only server-side settings are affected; chats,
              # users, models, prompts, knowledge, memories and files are separate
              # tables, and Admin settings still apply for the session, they just
              # do not outlive a restart.
              ENABLE_PERSISTENT_CONFIG: "false"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  # The first start runs the DB migrations; 30 x 10s is the
                  # budget for that, after which liveness takes over.
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 8080
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          open-webui:
            copy-app-data:
              - path: /tmp/app-data
            app:
              - path: /app/backend/data
