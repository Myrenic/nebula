apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mediafusion
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mediafusion
  values:
    controllers:
      mediafusion:
        containers:
          app:
            image:
              repository: mhdzumair/mediafusion
              tag: "6.1.3"
            env:
              HOST_URL: "https://mediafusion.${SECRET_DOMAIN_0}"
              POSTER_HOST_URL: "https://mediafusion.${SECRET_DOMAIN_0}"
              CONTACT_EMAIL: "mike@tuntelder.com"
              DEFAULT_COLOR_SCHEME: "mediafusion"
              POSTGRES_URI: "postgresql://mediafusion:mediafusion@mediafusion-postgres:5432/mediafusion"
              DB_MAX_CONNECTIONS: "50"
              REDIS_URL: "redis://mediafusion-redis:6379"
              PROWLARR_URL: "http://prowlarr:9696"
              PROWLARR_API_KEY: "${MEDIAFUSION_PROWLARR_API_KEY}"
              PROWLARR_IMMEDIATE_MAX_PROCESS: "30"
              PROWLARR_IMMEDIATE_MAX_PROCESS_TIME: "30"
              PROWLARR_SEARCH_INTERVAL_HOUR: "24"
              prowlarr_live_title_search: "true"
              IS_SCRAP_FROM_TORZNAB: "false"
              TORZNAB_ENDPOINTS: "[]"
              IS_SCRAP_FROM_TORRENTIO: "false"
              is_scrap_from_mediafusion: "false"
              is_scrap_from_zilean: "false"
              store_stremthru_magnet_cache: "false"
              TRAWL_URL: ""
              PUBLIC_INDEXERS_LIVE_SEARCH_ENABLE_CLOUDFLARE_SOLVER: "false"
              TASKIQ_SINGLE_WORKER_MODE: "true"
              ENABLE_RATE_LIMIT: "false"
              SECRET_KEY: "${MEDIAFUSION_SECRET_KEY}"
              API_PASSWORD: "${MEDIAFUSION_API_PASSWORD}"
              GUNICORN_WORKERS: "3"
              GUNICORN_TIMEOUT: "120"
              GUNICORN_MAX_REQUESTS: "5000"
              GUNICORN_MAX_REQUESTS_JITTER: "2000"
              TZ: "${TZ}"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
      worker:
        containers:
          app:
            image:
              repository: mhdzumair/mediafusion
              tag: "6.1.3"
            args:
              - "/usr/local/bin/mediafusion-worker"
            env:
              POSTGRES_URI: "postgresql://mediafusion:mediafusion@mediafusion-postgres:5432/mediafusion"
              REDIS_URL: "redis://mediafusion-redis:6379"
              TZ: "${TZ}"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: mediafusion
        ports:
          http:
            port: 8000
    persistence:
      media-data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /app/data
