apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
data:
  config.yml: |
    # LAN-only exposure via Traefik (ipAllowList middleware); frigate's own
    # auth layer is off and the UI is served unauthenticated on port 5000.
    auth:
      enabled: false

    mqtt:
      enabled: false

    # Object detection on the Intel iGPU via OpenVINO (bundled SSD MobileNet
    # v2) instead of the CPU TFLite fallback. In 0.17 the model config is a
    # top-level key shared by all detectors.
    detectors:
      ov:
        type: openvino
        device: GPU

    model:
      # YOLO-NAS-S 320x320 exported for frigate (FLAT predictions, uint8 BGR
      # input); more reliable detections than the bundled SSD MobileNet v2.
      model_type: yolonas
      path: /config/model_cache/yolo_nas_s_320.onnx
      width: 320
      height: 320
      input_tensor: nchw
      input_pixel_format: bgr
      labelmap_path: /labelmap/coco-80.txt

    face_recognition:
      enabled: true
      # Large embeddings model - affordable with the iGPU handling inference.
      model_size: large

    semantic_search:
      enabled: true

    # The reolinkproxy sidecar (same pod) re-serves the camera over stable
    # local RTSP; the camera itself is only contacted by the proxy.
    go2rtc:
      streams:
        frontdoor:
          - rtsp://127.0.0.1:8556/frontdoor/stream_sub
        frontdoor_main:
          - rtsp://127.0.0.1:8556/frontdoor/stream_main

    cameras:
      frontdoor:
        enabled: true
        ffmpeg:
          # preset-rtsp-restream is the documented input preset for localhost
          # restreams; VAAPI decodes the 4K main stream on the iGPU for
          # detection (faces are recognition-grade there, the 640x360 sub
          # stream only yields ~15px faces) and recordings are stream-copied
          # (AAC audio copied) to disk.
          hwaccel_args: preset-vaapi
          input_args: preset-rtsp-restream
          output_args:
            record: preset-record-generic-audio-copy
          inputs:
            - path: rtsp://127.0.0.1:8556/frontdoor/stream_main
              roles: [record, detect]
        detect:
          enabled: true
          width: 3840
          height: 2160
          fps: 5
        objects:
          track: [person]
        record:
          enabled: true
          alerts:
            retain:
              days: 14
            pre_capture: 5
            post_capture: 5
          detections:
            retain:
              days: 7
            pre_capture: 5
            post_capture: 5
          continuous:
            days: 0
          motion:
            days: 7

    snapshots:
      enabled: true
      retain:
        default: 7

    version: 0.17-0
