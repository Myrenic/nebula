apiVersion: v1
kind: ConfigMap
metadata:
  name: frigate-config
data:
  config.yml: |
    # LAN-only exposure via Traefik (ipAllowList middleware); frigate's own
    # auth layer is off and the UI is served unauthenticated on port 5000.
    auth:
      enabled: false

    mqtt:
      enabled: false

    # Object detection on the Intel iGPU via OpenVINO (bundled SSD MobileNet
    # v2) instead of the CPU TFLite fallback. In 0.17 the model config is a
    # top-level key shared by all detectors.
    detectors:
      ov:
        type: openvino
        device: GPU

    model:
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      labelmap_path: /openvino-model/coco_91cl_bkgr.txt

    cameras:
      reolink:
        enabled: true
        ffmpeg:
          # Reolink stability: force RTSP over TCP (UDP causes dropped
          # frames). Decode only the low-res sub stream on the iGPU (VAAPI);
          # the main stream is stream-copied straight to disk for recordings.
          input_args: preset-rtsp-tcp
          inputs:
            - path: "${CAMERA_RTSP_MAIN}"
              roles: [record]
            - path: "${CAMERA_RTSP_SUB}"
              roles: [detect]
              hwaccel_args: preset-vaapi
        detect:
          fps: 5

    # 0.17 tiered recording retention: continuous recording stays disabled
    # (default); only alert/detection events are kept.
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 7

    snapshots:
      enabled: true
      retain:
        default: 7

    version: 0.17-0
