apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: frigate
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      frigate:
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.17.0
            env:
              LIBVA_DRIVER_NAME: iHD
              TZ: "${TZ}"
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                # iGPU VRAM is shared system RAM; detector + enrichments
                # (YOLO-NAS, large face model, semantic search) + go2rtc all
                # allocate there. 2Gi OOM-killed the container.
                memory: 6Gi
            securityContext:
              # Frigate needs device access (iGPU render node) and privileged
              # helper processes; the official docs recommend privileged.
              privileged: true
          reolinkproxy:
            # Translates Reolink's proprietary Baichuan protocol (TCP 9000)
            # into stable RTSP - the camera's own RTSP server is flaky with
            # concurrent clients. RTSP on :8556 (frigate's go2rtc already
            # binds 8554/8555 in the pod).
            image:
              repository: ghcr.io/shareed2k/reolinkproxy
              tag: latest
            env:
              REOLINK_CAMERA_0_NAME: frontdoor
              REOLINK_CAMERA_0_HOST: 10.0.50.209
              REOLINK_CAMERA_0_USERNAME: "${CAMERA_ADMIN_USERNAME}"
              REOLINK_CAMERA_0_PASSWORD: "${CAMERA_ADMIN_PASSWORD}"
              REOLINK_CAMERA_0_STREAM: main,sub
              REOLINK_CAMERA_0_CHANNEL: "0"
              REOLINK_CAMERA_0_IDLE_DISCONNECT: "true"
              REOLINK_CAMERA_0_IDLE_TIMEOUT: "30s"
              REOLINK_SERVER_RTSP_ADDRESS: ":8556"
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /usr/local/bin/reolinkproxy
                      - healthcheck
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 3
    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: frigate
        ports:
          http:
            port: 8971
          http-internal:
            port: 5000
          rtsp:
            port: 8554
          webrtc-tcp:
            port: 8555
          webrtc-udp:
            port: 8555
            protocol: UDP
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: frigate-config
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
      media:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 50Gi
        globalMounts:
          - path: /media/frigate
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      tmp-cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp/cache
      dri:
        type: hostPath
        hostPath: /dev/dri
        hostPathType: Directory
        globalMounts:
          - path: /dev/dri
