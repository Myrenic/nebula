# The API trusts X-Auth-Request-* headers from Traefik/oauth2-proxy, so the
# web pod must only be reachable through Traefik. Workers get internet access
# only where the data providers and PyPI live.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mushroom-finder-web
  namespace: services
spec:
  podSelector:
    matchLabels:
      app: mushroom-finder
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
      ports:
        - protocol: TCP
          port: 80
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostGIS
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Alleen nog uitgaand verkeer naar de databronnen (PDOK, Nominatim,
    # Wikimedia) en naar PyPI voor de init-container.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
# De database is alleen bereikbaar voor deze app en haar worker-Jobs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mushroom-finder-postgres
  namespace: services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mushroom-finder
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mushroom-finder
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mushroom-finder-worker
  namespace: services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mushroom-finder
      app.kubernetes.io/component: worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
