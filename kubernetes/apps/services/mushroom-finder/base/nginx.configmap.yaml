# nginx voor de webui: SPA-fallback, beveiligingsheaders en /api naar de
# API in dezelfde pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mushroom-nginx
  namespace: services
data:
  default.conf: |
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # De pagina is openbaar en alleen-lezen. Deze headers kosten niets.
        # De CSP staat alleen de eigen bestanden toe plus de soortfoto's van
        # Wikimedia; verder wordt er niets van buiten geladen.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://thumb.wikimedia.org https://upload.wikimedia.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        # API: server-side validated refresh jobs, hotspots, weather.
        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
