apiVersion: apps/v1
kind: Deployment
metadata:
  name: mushroom-finder
  namespace: services
  labels:
    app: mushroom-finder
    app.kubernetes.io/name: mushroom-finder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mushroom-finder
  template:
    metadata:
      labels:
        app: mushroom-finder
        app.kubernetes.io/name: mushroom-finder
    spec:
      serviceAccountName: mushroom-finder-api
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Runtime Python deps land in a shared emptyDir. The cluster has no
        # custom image registry, so dependencies are installed into the pod
        # instead of being baked into an image.
        - name: deps
          image: docker.io/library/python:3.12-slim
          command:
            - /bin/sh
            - -c
            - "pip install --no-cache-dir --target=/deps 'psycopg[binary]' requests"
          volumeMounts:
            - name: deps
              mountPath: /deps
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: webui
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: webui
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # API: serves hotspots/weather/refresh state and triggers refresh Jobs
        # through the Kubernetes API using its narrowly-scoped ServiceAccount.
        - name: api
          image: docker.io/library/python:3.12-slim
          command: ["python3", "/app/server.py"]
          ports:
            - name: api
              containerPort: 3001
          env:
            - name: PYTHONPATH
              value: "/deps:/worker"
            - name: API_PORT
              value: "3001"
            - name: KUBE_NAMESPACE
              value: "services"
            - name: WORKER_IMAGE
              value: "docker.io/library/python:3.12-slim"
            - name: WORKER_IMAGE_RASTER
              value: "docker.io/library/python:3.12"
            - name: ADMIN_GROUPS
              value: "admin,admins"
            - name: TZ
              value: "${TZ}"
            - name: PGHOST
              value: "mushroom-finder-postgres"
            - name: PGDATABASE
              value: "mushroom"
            - name: PGUSER
              value: "mushroom"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mushroom-finder-db
                  key: password
          volumeMounts:
            - name: api-code
              mountPath: /app
              readOnly: true
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: worker-code
              mountPath: /worker
              readOnly: true
            - name: deps
              mountPath: /deps
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: webui
          configMap:
            name: mushroom-webui
        - name: nginx-conf
          configMap:
            name: mushroom-nginx
        - name: api-code
          configMap:
            name: mushroom-api
        - name: migrations
          configMap:
            name: mushroom-migrations
        - name: worker-code
          configMap:
            name: mushroom-worker
        - name: deps
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
