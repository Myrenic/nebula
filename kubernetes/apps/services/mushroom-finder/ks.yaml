# The app (FastAPI service, workers, SPA, migrations) lives in
# https://github.com/Myrenic/mushroom-finder. Everything platform-side stays
# here: this Kustomization, the ingress route in network/ingressroutes, the
# cluster-secrets substitution and the Longhorn dependency.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mushroom-finder
  namespace: flux-system
spec:
  targetNamespace: services
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./base
  sourceRef:
    kind: GitRepository
    name: mushroom-finder
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  dependsOn:
    - name: longhorn
  wait: false
