apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  interval: 1h
  dependsOn:
    - name: forgejo-postgres
  chartRef:
    kind: OCIRepository
    name: forgejo
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # image.tag is deliberately not set: the chart's appVersion is the Forgejo
    # version, so bumping the chart (Renovate, on the OCIRepository tag) is the
    # one move that upgrades the application, and a pinned tag here would fight
    # it.
    gitea:
      # Keycloak is the account source. The address below is what makes the two
      # accounts one: on the first Keycloak sign-in Forgejo tries to create a user
      # with the address the provider returned, that name is taken, and
      # ACCOUNT_LINKING=auto links the Keycloak identity to this admin account
      # instead of duplicating it. Set it to the realm user's address and not to
      # some other mailbox, or the login lands in a second, non-admin account.
      admin:
        username: "${FORGEJO_ADMIN_USERNAME}"
        password: "${FORGEJO_ADMIN_PASSWORD}"
        email: "${FORGEJO_ADMIN_EMAIL}"
        # The declared password wins: every pod start re-applies it, so changing
        # it in the web UI is undone at the next restart. Change it here instead.
        # It is the break-glass credential; day to day the account is used through
        # Keycloak.
        passwordMode: keepUpdated
      # The login source, created from these values by the chart's init container
      # (gitea admin auth add-oauth). The client is a hand-made object in realm
      # mytops - see the note in the README - with exactly one redirect URI:
      # https://code.<domain>/user/oauth2/keycloak/callback
      #
      # The scopes are not optional: add-oauth defaults the source to "openid"
      # alone, and without email and profile the userinfo response carries
      # neither an address nor a nickname, which leaves Forgejo unable to create
      # the account on a first sign-in. (Checked against the authorize URL:
      # scope=openid email profile.)
      oauth:
        # The name is not only a label: it is the URL segment of the callback
        # (/user/oauth2/Keycloak/callback, which is the client's one redirect URI)
        # and the text Forgejo puts on the sign-in button, which is why it is
        # spelled the way a proper noun is.
        - name: Keycloak
          provider: openidConnect
          key: forgejo
          secret: "${FORGEJO_OAUTH_CLIENT_SECRET}"
          autoDiscoverUrl: "https://keycloak.${SECRET_DOMAIN_0}/realms/mytops/.well-known/openid-configuration"
          scopes: "openid,email,profile"
      config:
        APP_NAME: "code.${SECRET_DOMAIN_0}"
        RUN_MODE: prod
        server:
          DOMAIN: "code.${SECRET_DOMAIN_0}"
          ROOT_URL: "https://code.${SECRET_DOMAIN_0}/"
        database:
          DB_TYPE: postgres
          HOST: forgejo-postgres:5432
          NAME: forgejo
          USER: forgejo
          PASSWD: "${FORGEJO_DB_PASSWORD}"
          SSL_MODE: disable
        service:
          # The host is on the public DNS like every other one here, and the local
          # sign-up form is what spam finds. Accounts are made by Keycloak (below)
          # or by hand in Site administration, never by a form.
          DISABLE_REGISTRATION: true
        # How the Keycloak source above is allowed to make accounts. Together these
        # two give the model the rest of the cluster already has (oauth2-proxy's
        # email-domain is *): anyone in realm mytops gets an account on first
        # sign-in, and a login whose address belongs to an existing account links
        # to it - which is what keeps the admin account the admin account. Set
        # ENABLE_AUTO_REGISTRATION to false and every new person needs an account
        # created for them first, with an address that matches the realm.
        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
          ACCOUNT_LINKING: auto
        session:
          # Default is memory, which would sign everyone out on every restart -
          # and this pod restarts whenever the chart or the theme changes.
          PROVIDER: db
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
      # The chart creates gitea-shared-storage, and without this it is the one
      # object a forge restore cannot find: everything else the forge owns
      # carries app.kubernetes.io/name, so a restore selected by that label
      # would bring back Forgejo and its postgres while silently leaving the
      # repositories behind. Labelling the claim puts it in the same selector.
      labels:
        app.kubernetes.io/name: forgejo
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    containerSecurityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    # The theme. Everything below lands inside the /data volume, which is where
    # Forgejo looks for anything that overrides what it ships (FORGEJO_CUSTOM is
    # /data/gitea in this image):
    #
    #   custom/public/assets/...    fetched by the browser at /assets/...
    #   custom/templates/...        replaces a page, or is included by one
    #
    # favicon.svg shadows the bundled icon because custom/public sits on the same
    # URL (/assets/img/favicon.svg). The two logo files are new names on purpose:
    # see the comment on #navbar-logo in theme/nebula.css.
    extraVolumes:
      - name: theme
        configMap:
          name: forgejo-theme
    extraContainerVolumeMounts:
      - name: theme
        mountPath: /data/gitea/public/assets/css/nebula.css
        subPath: nebula.css
        readOnly: true
      - name: theme
        mountPath: /data/gitea/public/assets/img/favicon.svg
        subPath: favicon.svg
        readOnly: true
      - name: theme
        mountPath: /data/gitea/public/assets/img/nebula-navy.svg
        subPath: logo-navy.svg
        readOnly: true
      - name: theme
        mountPath: /data/gitea/public/assets/img/nebula-sky.svg
        subPath: logo-sky.svg
        readOnly: true
      - name: theme
        mountPath: /data/gitea/templates/custom/header.tmpl
        subPath: header.tmpl
        readOnly: true
      - name: theme
        mountPath: /data/gitea/templates/home.tmpl
        subPath: home.tmpl
        readOnly: true
