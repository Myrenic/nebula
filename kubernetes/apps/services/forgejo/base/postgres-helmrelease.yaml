apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-postgres
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: forgejo-app-template
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      forgejo-postgres:
        containers:
          app:
            image:
              repository: postgres
              tag: 18-alpine
            env:
              POSTGRES_USER: forgejo
              POSTGRES_DB: forgejo
              POSTGRES_PASSWORD: "${FORGEJO_DB_PASSWORD}"
              TZ: "${TZ}"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    service:
      postgres:
        controller: forgejo-postgres
        ports:
          postgres:
            port: 5432
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /var/lib/postgresql
