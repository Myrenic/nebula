apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aiomanager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: aiomanager
  values:
    controllers:
      aiomanager:
        containers:
          app:
            image:
              repository: ghcr.io/sonicx161/aiomanager
              tag: latest
            env:
              PORT: "1610"
              NODE_ENV: "production"
              DB_TYPE: "sqlite"
              DATA_DIR: "/app/data"
              DB_FILENAME: "aio.db"
              MAX_SYNC_PAYLOAD_SIZE: "104857600"
              MAX_TIMEOUT: "20000"
              CORS_ORIGINS: "*"
              LOG_LEVEL: "info"
              LOG_PRETTY_PRINT: "true"
              TZ: "${TZ}"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 1610
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /app/data
