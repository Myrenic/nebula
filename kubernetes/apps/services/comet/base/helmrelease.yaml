apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: comet
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: comet
  values:
    controllers:
      comet:
        containers:
          app:
            image:
              repository: g0ldyy/comet
              tag: latest
            env:
              FASTAPI_PORT: "2020"
              DATABASE_TYPE: "postgresql"
              DATABASE_URL: "postgresql://comet:comet@comet-postgres:5432/comet"
              COMETNET_ENABLED: "False"
              COMETNET_SKIP_REACHABILITY_CHECK: "True"
              COMETNET_ADVERTISE_URL: "wss://comet.${SECRET_DOMAIN_0}/cometnet/ws"
              COMETNET_BOOTSTRAP_NODES: "[]"
              COMETNET_MANUAL_PEERS: "[]"
              COMETNET_API_KEY: "${COMET_COMETNET_API_KEY}"
              TZ: "${TZ}"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 2020
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /app/data
