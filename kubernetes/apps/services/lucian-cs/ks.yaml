# The site (Vite/React source, the built bundle and the nginx config) lives in
# https://github.com/Myrenic/lucian-cs. Everything platform-side stays here: this
# Kustomization and the ingress route in network/exposure.
#
# No dependsOn: unlike mushroom-finder this app has no database and no volume,
# so it needs nothing from longhorn. The cluster has no image registry either,
# which is why the built site ships inside the repository as a ConfigMap.
#
# No postBuild.substituteFrom either, and that is not an oversight: Flux runs
# envsubst over every resource, the bundle is JavaScript full of `${...}`
# template literals, and envsubst fails the whole Kustomization on them (seen
# as "missing closing brace"). Nothing in ./base needs a cluster secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lucian-cs
  namespace: flux-system
spec:
  targetNamespace: services
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./base
  sourceRef:
    kind: GitRepository
    name: lucian-cs
    namespace: flux-system
  wait: false
