apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: stalker-stremio-src
    files:
      - src/server.js
      - src/stalker.js
      - src/addon.js
      - src/config-ui.html
      - src/package.json
generatorOptions:
  labels:
    app.kubernetes.io/name: stalker-stremio
