# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./service.yaml
configMapGenerator:
  # Only the files the addon loads at runtime. Two files in this directory are
  # deliberately not listed and are therefore never applied or shipped:
  #   - Dockerfile: marked `# not-applied` at the top; a local build convenience.
  #   - src/stalker.test.js: needs `node --test` and the test runner, so it is
  #     run from a checkout (`npm test`), not from a ConfigMap in the cluster.
  - name: stalker-stremio-src
    files:
      - src/server.js
      - src/start.js
      - src/stalker.js
      - src/addon.js
      - src/config-ui.html
      - src/package.json
generatorOptions:
  labels:
    app.kubernetes.io/name: stalker-stremio
