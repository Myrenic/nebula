apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalker-stremio
  labels:
    app.kubernetes.io/name: stalker-stremio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalker-stremio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalker-stremio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: addon
          image: docker.io/library/node:22-alpine
          command: ["node", "/app/src/start.js"]
          ports:
            - name: http
              containerPort: 7000
          env:
            - name: PORT
              value: "7000"
          volumeMounts:
            - name: src
              mountPath: /app/src
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: src
          configMap:
            name: stalker-stremio-src
        - name: tmp
          emptyDir: {}
