apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stalker-stremio
  namespace: flux-system
spec:
  targetNamespace: services
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  path: ./kubernetes/apps/services/stalker-stremio/base
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
