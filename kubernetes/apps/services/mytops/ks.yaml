# The app (SPA, workplace API, coturn, idle culler) lives in
# https://github.com/Myrenic/mytops; this Kustomization is the deployment
# contract: which path, which namespace, and which secrets are substituted.
#
# No decryption is configured: the app repository stores no encrypted files. Its
# one Secret (base/mytops-turn.yaml) references ${TURN_SHARED_SECRET}, which this
# postBuild substitutes from the cluster-secrets SOPS bundle. If the app ever
# commits its own *.sops.yaml, add decryption here.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mytops
  namespace: flux-system
spec:
  targetNamespace: services
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./base
  sourceRef:
    kind: GitRepository
    name: mytops
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
