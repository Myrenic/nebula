apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
data:
  # Glance's entry point runs it as `glance --config /app/config/glance.yml`, so
  # this file *is* the dashboard. It is a mounted ConfigMap rather than an image
  # build: kubelet refreshes the mount and Glance watches the file, so editing
  # this and pushing is a reload, not a rollout.
  #
  # ${...} here is Flux's build-time substitution (postBuild on the Kustomization
  # reads cluster-secrets), not Glance's own ${ENV_VAR} syntax - so no hostname
  # and no home town is in this public repository. Glance's syntax stays available
  # for anything that must not even reach the rendered ConfigMap.
  glance.yml: |
    # The cluster's front page: what nebula exposes, what this repository is
    # doing, and the two feeds worth reading. Nothing here is a secret and there
    # is no `auth` block - the route that reaches Glance
    # (kubernetes/apps/network/exposure/glance.yaml) is behind oauth2-proxy,
    # which is the whole gate.
    server:
      # Traefik terminates TLS and oauth2-proxy forwards the request on, so the
      # X-Forwarded-* headers are the only place the real client address lives.
      proxied: true

    branding:
      app-name: nebula

    # Neon Pink, copied from upstream's theme gallery (docs/themes.md). It is the
    # default here; the picker stays enabled, so a browser can still switch back
    # to the stock dark theme without a change in git.
    theme:
      background-color: 240 27 11
      contrast-multiplier: 1.5
      primary-color: 321 100 71
      positive-color: 165 78 51
      negative-color: 360 100 71

    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 24h

              # The location lives in cluster-secrets as WEATHER_LOCATION, because
              # this repository is public and a city is a home address. Open-Meteo
              # needs no key; it does need the country spelled out ("Groningen,
              # Netherlands" geocodes to nothing, "The Netherlands" to the right
              # one) and the province pinned, which is what the three-part form in
              # the secret does.
              - type: weather
                location: ${WEATHER_LOCATION}
                units: metric
                hour-format: 24h

              # The repository the cluster converges from, live. Renovate runs on
              # it, so the pull requests are the updates that are waiting and the
              # commits are the ones that landed - which is the whole point of
              # having it here. No token: 60 unauthenticated GitHub requests per
              # hour, against a widget whose own default cache is 1h.
              - type: repository
                repository: Myrenic/nebula
                pull-requests-limit: 5
                issues-limit: 1
                commits-limit: 3

          - size: full
            widgets:
              # One entry per exposed host, checked over the URL a browser uses -
              # so DNS, the wildcard certificate and the route are covered along
              # with the workload behind them. Prometheus blackbox and Uptime
              # Kuma measure the same hosts and alert on them; this is the copy
              # an operator reads before opening a terminal.
              #
              # alt-status-codes: 401 is what the oauth2-proxy forwardAuth answers
              # an unauthenticated GET with, and that is the route working rather
              # than failing. Everything else is expected to answer 200 (the two
              # that redirect, keycloak and status, are followed to it).
              - type: monitor
                title: cluster
                sites:
                  - title: Forgejo
                    url: https://code.${SECRET_DOMAIN_0}
                    icon: di:forgejo
                  - title: Grafana
                    url: https://grafana.${SECRET_DOMAIN_0}
                    icon: di:grafana
                    alt-status-codes: [401]
                  - title: Uptime Kuma
                    url: https://status.${SECRET_DOMAIN_0}
                    icon: di:uptime-kuma
                  - title: Flux
                    url: https://flux.${SECRET_DOMAIN_0}
                    icon: di:flux-cd
                    alt-status-codes: [401]
                  - title: Longhorn
                    url: https://longhorn.${SECRET_DOMAIN_0}
                    icon: di:longhorn
                    alt-status-codes: [401]
                  - title: Traefik
                    url: https://traefik.${SECRET_DOMAIN_0}
                    icon: di:traefik
                    alt-status-codes: [401]
                  - title: Keycloak
                    url: https://keycloak.${SECRET_DOMAIN_0}
                    icon: di:keycloak
                  - title: mytops
                    url: https://apps.${SECRET_DOMAIN_0}
                    alt-status-codes: [401]
                  - title: Open WebUI
                    url: https://chat.${SECRET_DOMAIN_0}
                    icon: di:open-webui
                  - title: SearXNG
                    url: https://search.${SECRET_DOMAIN_0}
                    icon: di:searxng
                  - title: Home Assistant
                    url: https://home.${SECRET_DOMAIN_0}
                    icon: di:home-assistant
                  - title: Frigate
                    url: https://frigate.${SECRET_DOMAIN_0}
                    icon: di:frigate
                  - title: AIOStreams
                    url: https://aiostreams.${SECRET_DOMAIN_0}
                  - title: Spottarr
                    url: https://spottarr.${SECRET_DOMAIN_0}
                  - title: Stalker
                    url: https://stalker.${SECRET_DOMAIN_0}
                    icon: di:stremio
                  - title: Mushrooms
                    url: https://mushrooms.${SECRET_DOMAIN_0}
                  - title: Lucian
                    url: https://lucian.${SECRET_DOMAIN_0}

          - size: small
            widgets:
              # Tweakers' news feed. feeds.tweakers.net does not resolve; the
              # working URL is the one their own RSS page links to.
              - type: rss
                title: Tweakers
                limit: 10
                collapse-after: 5
                feeds:
                  - url: https://tweakers.net/feeds/nieuws.xml

              # The subreddit this cluster's software comes from. vertical-cards
              # is the style written for a small column (the list styles are for
              # full ones), and it is why there is no collapse-after here - that
              # option does not exist for the card styles.
              - type: reddit
                title: r/selfhosted
                subreddit: selfhosted
                style: vertical-cards
                limit: 10
                sort-by: hot
