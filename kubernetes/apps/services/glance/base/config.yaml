apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
data:
  # Glance's entry point runs it as `glance --config /app/config/glance.yml`, so
  # this file *is* the dashboard. It is a mounted ConfigMap rather than an image
  # build: kubelet refreshes the mount and Glance watches the file, so editing
  # this and pushing is a reload, not a rollout.
  #
  # Every placeholder below is Flux's build-time substitution (postBuild on the
  # Kustomization reads cluster-secrets), not Glance's own environment-variable
  # syntax - so no hostname and no home town is in this public repository. Glance's
  # own variable syntax stays available for anything that must not even reach the
  # rendered ConfigMap.
  #
  # Write those placeholders in full or not at all: the substitution is textual
  # and runs over the whole object, so a bare brace pair inside a comment is a
  # parse error ("unable to parse variable name") and fails the Kustomization.
  # This paragraph shipped that way once; it says it in words now.
  glance.yml: |
    # The cluster's front page: what nebula exposes, what this repository is
    # doing, and the two feeds worth reading. Nothing here is a secret and there
    # is no `auth` block - the route that reaches Glance
    # (kubernetes/apps/network/exposure/glance.yaml) is behind oauth2-proxy,
    # which is the whole gate.
    server:
      # Traefik terminates TLS and oauth2-proxy forwards the request on, so the
      # X-Forwarded-* headers are the only place the real client address lives.
      proxied: true

    branding:
      app-name: nebula

    # Neon Pink, copied from upstream's theme gallery (docs/themes.md). It is the
    # default here; the picker stays enabled, so a browser can still switch back
    # to the stock dark theme without a change in git.
    theme:
      background-color: 240 27 11
      contrast-multiplier: 1.5
      primary-color: 321 100 71
      positive-color: 165 78 51
      negative-color: 360 100 71

    pages:
      - name: Home
        columns:
          # Left, narrow: the time, the weather, and what the repository is doing.
          - size: small
            widgets:
              - type: clock
                hour-format: 24h

              # The location lives in cluster-secrets as WEATHER_LOCATION, because
              # this repository is public and a city is a home address. Open-Meteo
              # needs no key; it does need the country spelled out ("Groningen,
              # Netherlands" geocodes to nothing, "The Netherlands" to the right
              # one) and the province pinned, which is what the three-part form in
              # the secret does.
              - type: weather
                location: ${WEATHER_LOCATION}
                units: metric
                hour-format: 24h

              # The repository the cluster converges from, live. Renovate runs on
              # it, so the pull requests are the updates that are waiting and the
              # commits are the ones that landed - which is the whole point of
              # having it here. No token: 60 unauthenticated GitHub requests per
              # hour, against a widget whose own default cache is 1h.
              - type: repository
                repository: Myrenic/nebula
                pull-requests-limit: 5
                issues-limit: 1
                commits-limit: 3

          # Middle, wide: the two feeds. They are the only widgets here that
          # want the width, which is why the column carries it.
          - size: full
            widgets:
              # Tweakers' news feed. feeds.tweakers.net does not resolve; the
              # working URL is the one their own RSS page links to.
              - type: rss
                title: Tweakers
                limit: 10
                collapse-after: 5
                feeds:
                  - url: https://tweakers.net/feeds/nieuws.xml

              # The subreddit this cluster's software comes from. vertical-list is
              # the style written for a full column (vertical-cards is the one for
              # a small column), and it is the only style that takes
              # show-thumbnails and collapse-after.
              - type: reddit
                title: r/selfhosted
                subreddit: selfhosted
                style: vertical-list
                show-thumbnails: true
                limit: 10
                collapse-after: 5
                sort-by: hot

          # Right, narrow: the cluster itself. One host per row, because a narrow
          # column cannot lay the list out in two - the names are short and the
          # numbers are what matters.
          - size: small
            widgets:
              # Per-node health, read straight out of the in-cluster Prometheus
              # HTTP API: no agent to install (a glances exporter cannot live on
              # Talos), no docker socket, no new workload and no credential - the
              # kube-prometheus-stack Prometheus is plain HTTP on 9090 with no
              # authentication configured, and nothing in this repo blocks a pod
              # in `services` from querying it.
              #
              # Two things about the query are deliberate. node-exporter carries
              # no `node` label (the chart's relabeling is commented out), so the
              # node name is joined in from node_uname_info's `nodename`, which on
              # Talos is the node name. And the `ready` branch comes from
              # kube-state-metrics, not from node-exporter, precisely because a
              # node that stopped exporting disappears from every node-exporter
              # series - without it, talos-sz9-1vs (NotReady) would silently be
              # absent instead of visibly down. The `or` union keeps the four
              # series apart by tagging each with its own `stat` label.
              - type: custom-api
                title: nodes
                cache: 1m
                url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                headers:
                  Accept: application/json
                parameters:
                  query: |-
                    label_replace(
                      100 * (1 - avg by (instance, nodename) (
                        rate(node_cpu_seconds_total{mode="idle"}[5m]) * on(instance) group_left(nodename) node_uname_info
                      )),
                      "stat", "cpu", "instance", ".*"
                    )
                    or label_replace(
                      100 * (1 - (
                        (node_memory_MemAvailable_bytes * on(instance) group_left(nodename) node_uname_info)
                        / (node_memory_MemTotal_bytes * on(instance) group_left(nodename) node_uname_info)
                      )),
                      "stat", "mem", "instance", ".*"
                    )
                    or label_replace(
                      topk(1, 100 * (1 - (
                        (node_filesystem_avail_bytes{fstype=~"xfs|ext4"} * on(instance) group_left(nodename) node_uname_info)
                        / (node_filesystem_size_bytes{fstype=~"xfs|ext4"} * on(instance) group_left(nodename) node_uname_info)
                      ))) by (instance, nodename),
                      "stat", "disk", "instance", ".*"
                    )
                    or label_replace(
                      label_replace(kube_node_status_condition{condition="Ready",status="true"}, "nodename", "$1", "node", "(.*)"),
                      "stat", "ready", "node", ".*"
                    )
                template: |
                  {{ $results := .JSON.Array "data.result" }}
                  {{ $nodes := unique "metric.nodename" (sortByString "metric.nodename" "asc" $results) }}
                  <ul class="list list-gap-14">
                    {{ range $nodes }}
                      {{ $node := .String "metric.nodename" }}
                      <li>
                        <div class="flex items-center gap-7">
                          <span class="size-h4 color-highlight text-truncate">{{ $node }}</span>
                          {{ range $results }}
                            {{ if and (eq (.String "metric.nodename") $node) (eq (.String "metric.stat") "ready") }}
                              {{ if eq (.String "value.1") "0" }}<span class="size-h6 color-negative">DOWN</span>{{ end }}
                            {{ end }}
                          {{ end }}
                        </div>
                        {{ range $results }}
                          {{ if and (eq (.String "metric.nodename") $node) (ne (.String "metric.stat") "ready") }}
                            <div>
                              <div class="flex justify-between size-h5">
                                <span class="uppercase" title="{{ .String "metric.mountpoint" }}">{{ .String "metric.stat" }}</span>
                                <span class="color-highlight">{{ printf "%.0f" (.Float "value.1") }}%</span>
                              </div>
                              <div class="progress-bar"><div class="progress-value" style="--percent: {{ printf "%.0f" (.Float "value.1") }}"></div></div>
                            </div>
                          {{ end }}
                        {{ end }}
                      </li>
                    {{ end }}
                  </ul>

              # The hypervisor the cluster's VMs and every LXC on this box actually
              # run on, read from its own API. The token is glance@pve!glance - a
              # PVEAuditor (read-only) token this repository does not create,
              # because it cannot: its value lives in cluster-secrets and the
              # user, group and ACL live on the Proxmox host. See the bootstrap
              # notes in README.md for what was made by hand there.
              #
              # Self-signed certificate, hence allow-insecure. The template is
              # upstream's (glanceapp/community-widgets, proxmox-ve-nodes) with the
              # url, the title and the token reference changed - it prints per-node
              # CPU, RAM and disk with the bars the built-in server-stats widget
              # uses, and pve is a single node.
              - type: custom-api
                title: proxmox
                title-url: https://10.0.50.11:8006
                cache: 1m
                url: https://10.0.50.11:8006/api2/json/nodes
                allow-insecure: true
                headers:
                  Accept: application/json
                  Authorization: PVEAPIToken=${PROXMOX_TOKEN}
                options:
                  uptime-mode: duration  # relative | duration
                  collapse-after: 5
                template: | #html
                  {{ $uptimeMode := .Options.StringOr "uptime-mode" "relative" }}
                  {{ $collapseAfter := .Options.IntOr "collapseAfter" 3 }}
                  <ul class="list list-gap-14 collapsible-container" data-collapse-after="{{ $collapseAfter }}">
                    {{ range .JSON.Array "data" }}
                    <li>
                      <div class="server" proxmox-node="{{ .String "node" }}">
                        <div class="server-info">
                            <div class="server-details">
                                <div class="server-name color-highlight size-h3 text-truncate">
                                  {{ .String "node" }}
                                </div>
                                <div>
                                    {{ if eq $.Response.StatusCode 200 }}
                                      <div data-popover-type="html">
                                        <div data-popover-html>
                                          {{ if eq $uptimeMode "relative" }}
                                            <span {{ now.Add (duration (concat "-" (.String "uptime") "s")) | toRelativeTime }}></span>
                                          {{ else }}
                                            <span>{{ duration (concat (.String "uptime") "s") }}</span>
                                          {{ end }}
                                        </div>
                                        <div>
                                          {{ if ne $uptimeMode "relative" }}
                                            <span {{ now.Add (duration (concat "-" (.String "uptime") "s")) | toRelativeTime }}></span>
                                          {{ else }}
                                            <span>{{ duration (concat (.String "uptime") "s") }}</span>
                                          {{ end }}
                                        </div>
                                      </div>
                                    {{ else }}
                                      {{ .String "status" }}
                                    {{ end }}
                                </div>
                            </div>
                            <svg class="server-icon" stroke="var(--color-{{ if eq (.String "status") "online" }}positive{{ else }}negative{{ end }})" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 17.25v-.228a4.5 4.5 0 0 0-.12-1.03l-2.268-9.64a3.375 3.375 0 0 0-3.285-2.602H7.923a3.375 3.375 0 0 0-3.285 2.602l-2.268 9.64a4.5 4.5 0 0 0-.12 1.03v.228m19.5 0a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3m19.5 0a3 3 0 0 0-3-3H5.25a3 3 0 0 0-3 3m16.5 0h.008v.008h-.008v-.008Zm-3 0h.008v.008h-.008v-.008Z" />
                            </svg>
                        </div>
                        <div class="server-stats">
                            <div class="flex-1">
                                <div class="flex items-end size-h5">
                                    <div>CPU</div>
                                    {{ if (ge (mul (.Float "cpu") 100 | toInt ) 80) }}
                                    <svg class="server-spicy-cpu-icon" fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" >
                                        <path fill-rule="evenodd" d="M8.074.945A4.993 4.993 0 0 0 6 5v.032c.004.6.114 1.176.311 1.709.16.428-.204.91-.61.7a5.023 5.023 0 0 1-1.868-1.677c-.202-.304-.648-.363-.848-.058a6 6 0 1 0 8.017-1.901l-.004-.007a4.98 4.98 0 0 1-2.18-2.574c-.116-.31-.477-.472-.744-.28Zm.78 6.178a3.001 3.001 0 1 1-3.473 4.341c-.205-.365.215-.694.62-.59a4.008 4.008 0 0 0 1.873.03c.288-.065.413-.386.321-.666A3.997 3.997 0 0 1 8 8.999c0-.585.126-1.14.351-1.641a.42.42 0 0 1 .503-.235Z" clip-rule="evenodd" />
                                    </svg>
                                    {{ end }}
                                    <div class="color-highlight margin-left-auto text-very-compact">
                                      <span>{{ mul (.Float "cpu") 100 | toInt | formatNumber }}</span> <span class="color-base">%</span>
                                    </div>
                                </div>
                                <div data-popover-type="html">
                                    <div data-popover-html>
                                      <div>
                                        <div class="flex">
                                          <div class="size-h5">LOAD</div>
                                          <div class="value-separator"></div>
                                          <div class="color-highlight text-very-compact"><span>{{ mul (.Float "cpu") 100 | toInt | formatNumber }}</span> <span class="color-base size-h5">%</span></div>
                                        </div>
                                        <div class="flex margin-top-3">
                                          <div class="size-h5">CORES</div>
                                          <div class="value-separator"></div>
                                          <div class="color-highlight text-very-compact">{{ .Int "maxcpu" }}</div>
                                        </div>
                                      </div>
                                    </div>
                                    <div class="progress-bar progress-bar-combined">
                                        <div class="progress-value{{ if ge (mul (.Float "cpu") 100 | toInt) 80 }} progress-value-notice{{ end }}" style="--percent: {{ mul (.Float "cpu") 100 | toInt | formatNumber }}"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-end size-h5">
                                    <div>RAM</div>
                                    <div class="color-highlight text-very-compact">
                                      <span>{{ mul (div (.Int "mem" | toFloat) (.Int "maxmem" | toFloat)) 100 | toInt }}</span> <span class="color-base">%</span>
                                    </div>
                                </div>
                                <div data-popover-type="html">
                                    <div data-popover-html>
                                      <div>
                                        <div class="flex">
                                            <div class="size-h5">RAM</div>
                                            <div class="value-separator"></div>
                                            <div class="color-highlight text-very-compact">
                                              <span>{{ div (.Int "mem" | toFloat) 1073741824 | toInt | formatNumber }}GB</span>
                                              <span class="color-base size-h5">/</span>
                                              <span>{{ div (.Int "maxmem" | toFloat) 1073741824 | toInt | formatNumber }}GB</span>
                                            </div>
                                        </div>
                                      </div>
                                    </div>
                                    <div class="progress-bar progress-bar-combined">
                                      <div class="progress-value{{ if ge (mul (div (.Int "mem" | toFloat) (.Int "maxmem" | toFloat)) 100 | toInt) 80 }} progress-value-notice{{ end }}" style="--percent: {{ mul (div (.Int "mem" | toFloat) (.Int "maxmem" | toFloat)) 100 | toInt }}"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-end size-h5">
                                    <div>DISK</div>
                                    <div class="color-highlight text-very-compact">
                                      <span>{{ mul (div (.Int "disk" | toFloat) (.Int "maxdisk" | toFloat)) 100 | toInt }}</span> <span class="color-base">%</span>
                                    </div>
                                </div>
                                <div data-popover-type="html">
                                  <div data-popover-html>
                                    <div>
                                      <div class="flex">
                                          <div class="size-h5">DISK</div>
                                          <div class="value-separator"></div>
                                          <div class="color-highlight text-very-compact">
                                              <span>{{ div (.Int "disk" | toFloat) 1073741824 | toInt | formatNumber }}GB</span>
                                              <span class="color-base size-h5">/</span>
                                              <span>{{ div (.Int "maxdisk" | toFloat) 1073741824 | toInt | formatNumber }}GB</span>
                                          </div>
                                      </div>
                                    </div>
                                  </div>
                                  <div class="progress-bar progress-bar-combined">
                                    <div class="progress-value{{ if ge (mul (div (.Int "disk" | toFloat) (.Int "maxdisk" | toFloat)) 100 | toInt) 80 }} progress-value-notice{{ end }}" style="--percent: {{ mul (div (.Int "disk" | toFloat) (.Int "maxdisk" | toFloat)) 100 | toInt }}"></div>
                                  </div>
                                </div>
                            </div>
                        </div>
                      </div>
                    </li>
                    {{ end }}
                  </ul>

              # One entry per exposed host, checked over the URL a browser uses -
              # so DNS, the wildcard certificate and the route are covered along
              # with the workload behind them. Prometheus blackbox and Uptime
              # Kuma measure the same hosts and alert on them; this is the copy
              # an operator reads before opening a terminal.
              #
              # alt-status-codes: 401 is what the oauth2-proxy forwardAuth answers
              # an unauthenticated GET with, and that is the route working rather
              # than failing. Everything else is expected to answer 200 (the two
              # that redirect, keycloak and status, are followed to it).
              - type: monitor
                title: cluster
                sites:
                  - title: Forgejo
                    url: https://code.${SECRET_DOMAIN_0}
                    icon: di:forgejo
                  - title: Grafana
                    url: https://grafana.${SECRET_DOMAIN_0}
                    icon: di:grafana
                    alt-status-codes: [401]
                  - title: Uptime Kuma
                    url: https://status.${SECRET_DOMAIN_0}
                    icon: di:uptime-kuma
                  - title: Flux
                    url: https://flux.${SECRET_DOMAIN_0}
                    icon: di:flux-cd
                    alt-status-codes: [401]
                  - title: Longhorn
                    url: https://longhorn.${SECRET_DOMAIN_0}
                    icon: di:longhorn
                    alt-status-codes: [401]
                  - title: Traefik
                    url: https://traefik.${SECRET_DOMAIN_0}
                    icon: di:traefik
                    alt-status-codes: [401]
                  - title: Keycloak
                    url: https://keycloak.${SECRET_DOMAIN_0}
                    icon: di:keycloak
                  - title: mytops
                    url: https://apps.${SECRET_DOMAIN_0}
                    alt-status-codes: [401]
                  - title: Open WebUI
                    url: https://chat.${SECRET_DOMAIN_0}
                    icon: di:open-webui
                  - title: SearXNG
                    url: https://search.${SECRET_DOMAIN_0}
                    icon: di:searxng
                  - title: Home Assistant
                    url: https://home.${SECRET_DOMAIN_0}
                    icon: di:home-assistant
                  - title: Frigate
                    url: https://frigate.${SECRET_DOMAIN_0}
                    icon: di:frigate
                  - title: AIOStreams
                    url: https://aiostreams.${SECRET_DOMAIN_0}
                  - title: Spottarr
                    url: https://spottarr.${SECRET_DOMAIN_0}
                  - title: Stalker
                    url: https://stalker.${SECRET_DOMAIN_0}
                    icon: di:stremio
                  - title: Mushrooms
                    url: https://mushrooms.${SECRET_DOMAIN_0}
                  - title: Lucian
                    url: https://lucian.${SECRET_DOMAIN_0}

              # AIOStreams' own view of the addons it aggregates - the thing the
              # monitor above cannot see, because those addons are not hosts of
              # ours: they live inside AIOStreams' config, so there is no URL to
              # probe. This reads the per-addon analytics it already records
              # (requests, errors, error rate, average latency), which is the
              # closest thing to "is torrentio having a bad day".
              #
              # The dashboard API only takes a session cookie - Basic auth gets
              # the HTML login page back with a 200, which is how this looked
              # like it worked at first - so the template signs in, takes the
              # cookie off the login response, and asks with it. Credentials come
              # from cluster-secrets; the ConfigMap holds placeholders, never values.
              #
              # A 7-day window, not 24h: analytics only count real requests, so a
              # quiet day would empty the list and read as broken rather than
              # quiet. In-cluster URL on purpose: there is no reason to send this
              # through Traefik and back.
              #
              # The 15m cache is not arbitrary: the login endpoint is rate
              # limited to 5 requests per 5 minutes per IP, and the cluster and
              # the browser that opens this page share one egress address. One
              # login per quarter hour leaves the humans their budget, and a
              # refused login renders as a sentence rather than a failed widget,
              # because "rate limited" is not "AIOStreams is broken".
              - type: custom-api
                title: aiostreams addons (7d)
                cache: 15m
                template: |
                  {{ $base := "http://aiostreams.services.svc.cluster.local:3000" }}
                  {{ $login := newRequest (concat $base "/api/v1/auth/login")
                      | withHeader "Content-Type" "application/json"
                      | withStringBody (printf `{"username":"%s","password":"%s"}` "${AIOSTREAMS_AUTH_USER}" "${AIOSTREAMS_AUTH_PASSWORD}")
                      | getResponse }}
                  {{ if ne $login.Response.StatusCode 200 }}
                    <div class="color-base">AIOStreams login answered {{ $login.Response.StatusCode }}</div>
                  {{ else }}
                    {{ $cookie := findMatch "^[^;]+" ($login.Response.Header.Get "Set-Cookie") }}
                    {{ $addons := newRequest (concat $base "/api/v1/dashboard/analytics/addons?range=7d")
                        | withHeader "Cookie" $cookie
                        | withHeader "Accept" "application/json"
                        | getResponse }}
                    {{ if ne $addons.Response.StatusCode 200 }}
                      <div class="color-base">AIOStreams answered {{ $addons.Response.StatusCode }}</div>
                    {{ else if eq (len ($addons.JSON.Array "data.addons")) 0 }}
                      <div class="color-base">no requests in the last 7 days</div>
                    {{ else }}
                      <ul class="list list-gap-10">
                        {{ range sortByInt "requests" "desc" ($addons.JSON.Array "data.addons") }}
                          <li>
                            <div class="flex justify-between items-center gap-10">
                              <span class="color-highlight text-truncate">{{ .String "presetId" }}</span>
                              <span class="size-h6 {{ if gt (.Int "errors") 0 }}color-negative{{ else }}color-positive{{ end }}">
                                {{ if gt (.Int "errors") 0 }}{{ .Int "errors" }} err{{ else }}ok{{ end }}
                              </span>
                            </div>
                            <div class="size-h6 color-base text-truncate">{{ .Int "requests" }} req &middot; {{ printf "%.1f" (.Float "errorRate") }}% &middot; {{ .Int "avgLatencyMs" }}ms</div>
                          </li>
                        {{ end }}
                      </ul>
                    {{ end }}
                  {{ end }}
