apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: velero-ui
spec:
  # 0 until the cluster runs multiple nodes; with one replica any higher
  # value blocks node drains entirely.
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: velero-ui
      app.kubernetes.io/instance: velero-ui
