apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero
  namespace: flux-system
spec:
  targetNamespace: velero
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./kubernetes/apps/backup/velero/base
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Needed for exactly one value: ${TZ}, which pins the Velero server's local
  # time so its cron schedules mean the wall-clock times they are written as (see
  # configuration.extraEnvVars in base/helmrelease.yaml).
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: velero
      namespace: velero
