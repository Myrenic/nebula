apiVersion: v1
kind: Namespace
metadata:
  name: storage
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # privileged on purpose: the Longhorn manager and instance-manager pods are privileged (they mount block devices).
    pod-security.kubernetes.io/enforce: privileged
    # Pin the Pod Security Standards ruleset to the kubelet minor this cluster
    # runs (v1.37). The PSS rules are versioned and the label defaults to
    # "latest", so without this a cluster upgrade would silently change what
    # "privileged" is measured against; pinned, the enforced rules stay the ones
    # this namespace was validated against.
    pod-security.kubernetes.io/enforce-version: v1.37
