# Storage-namespace half of the mytops control RBAC: lets the workplace API's
# ServiceAccount delete Longhorn volume objects when a VM workspace is destroyed
# (the Longhorn StorageClasses use reclaimPolicy: Retain, so a deleted PVC leaves
# the volume behind).
#
# It lives here, next to the app's other cross-namespace grant
# (kubernetes/apps/network/ingressroutes/mytops-control.yaml), because the mytops
# Kustomization forces targetNamespace=services and would otherwise move this
# Role into the services namespace - where it grants nothing and where the
# Longhorn volumes are not. The namespace is `storage`, not `longhorn-system`:
# that is where the Longhorn HelmRelease installs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mytops-longhorn-volumes
  namespace: storage
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    # watch: kubectl watches the object to confirm its delete, and the culler
    # deletes these; without it its log fills with "cannot watch resource"
    # errors that read like permission failures.
    verbs: ["get", "list", "watch", "delete"]
---
# Cluster-scoped half of the same grant: the idle culler reclaims CDI's import
# scratch volumes (PVs named pvc-* whose claimRef is prime-<uuid>-scratch and
# which are Released - CDI deletes the PVC but the storage class retains, so
# every VM build leaves a 10Gi volume allocated). Finding them means listing
# PersistentVolumes, which no namespaced Role can do. The culler matches on
# that scratch pattern only; a workspace disk or a user home volume can never
# be selected by it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mytops-scratch-volumes
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mytops-scratch-volumes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mytops-scratch-volumes
subjects:
  - kind: ServiceAccount
    name: mytops-control
    namespace: services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mytops-longhorn-volumes
  namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mytops-longhorn-volumes
subjects:
  - kind: ServiceAccount
    name: mytops-control
    namespace: services
