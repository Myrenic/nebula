apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 15m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultSettings:
      autoSalvage: true
      defaultReplicaCount: 2
      # Longhorn's eigen default is 200. Dit stond in het cluster op 100 (drift,
      # niet in git) en dan mag de som van aangevraagde volumes per schijf niet
      # boven de schijfgrootte uitkomen. Daardoor kon de tweede replica van de
      # bestaande volumes niet geplaatst worden ("insufficient storage") en
      # bleef alles op 1 replica staan. Met 200 past het wel; de echte
      # bezetting blijft ruim onder de capaciteit (ongeveer 740 van 1211 GiB).
      storageOverProvisioningPercentage: 200
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      replicaAutoBalance: best-effort
      allowVolumeCreationWithDegradedAvailability: true
    persistence:
      # Single-node Omni cluster: hardcoding 2 would double-book every PVC on
      # one disk and wedge new volumes behind Longhorn's storage reservation
      # guard. The replica-adjuster cronjob raises existing volumes back to 2
      # automatically once a second node is Ready.
      defaultClassReplicaCount: 1
      allowVolumeExpansion: true
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
    preUpgradeChecker:
      jobEnabled: false
      upgradeVersionCheck: true
