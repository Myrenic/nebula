# Converges Longhorn volume replica counts to the number of Ready nodes.
#
# Why this exists: Longhorn's per-volume numberOfReplicas is fixed at creation
# time, so volumes created on a single-node cluster stay at 1 replica when a
# second node appears, and volumes created on 3 nodes stay at 2 when the cluster
# shrinks.
#
# What this job does NOT do (it used to, and it was a bug): patch
# settings.longhorn.io/default-replica-count. That value is owned by the
# longhorn HelmRelease, which renders it into the longhorn-default-setting
# ConfigMap that longhorn-manager enforces - so Helm kept re-asserting the
# chart value and the two writers fought each other. The replica count now has
# exactly one source of truth per StorageClass parameter (git).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-replica-adjuster
  namespace: storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-replica-adjuster
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "get"]
  # Nodig om een volume aan zijn PVC te koppelen, zodat volumes die maar één
  # replica hoeven (frigate-media) overgeslagen kunnen worden.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "get"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-replica-adjuster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-replica-adjuster
subjects:
  - kind: ServiceAccount
    name: longhorn-replica-adjuster
    namespace: storage
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-replica-adjuster
  namespace: storage
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: longhorn-replica-adjuster
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: adjuster
              # Was bitnami/kubectl:latest, which is unpinned and no longer
              # published in Bitnami's free catalog. Same image as the other
              # in-cluster kubectl jobs.
              image: alpine/k8s:1.36.0
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  # Count nodes with Ready=True condition
                  READY_NODES=$(kubectl get nodes -o jsonpath='{range .items[*]}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\n"}{end}{end}' | grep -c "True" || echo "0")
                  echo "Ready nodes: ${READY_NODES}"

                  # Determine target replica count
                  if [ "${READY_NODES}" -ge 2 ]; then
                    TARGET_REPLICAS=2
                  else
                    TARGET_REPLICAS=1
                  fi
                  echo "Target replica count: ${TARGET_REPLICAS}"

                  # PVC's die bewust op één replica blijven. Een tweede kopie
                  # kost hier alleen schijfruimte: het zijn grote datawaar we
                  # toch geen tweede exemplaar van nodig hebben.
                  SINGLE_REPLICA_PVCS="frigate-media"
                  EXCLUDED_VOLUMES=""
                  for pvc in ${SINGLE_REPLICA_PVCS}; do
                    for vn in $(kubectl get pvc -A \
                        -o jsonpath="{range .items[?(@.metadata.name=='${pvc}')]}{.spec.volumeName}{' '}{end}"); do
                      EXCLUDED_VOLUMES="${EXCLUDED_VOLUMES} ${vn}"
                    done
                  done
                  echo "Blijft op 1 replica:${EXCLUDED_VOLUMES}"

                  # Converge EXISTING volumes to the target replica count, so
                  # volumes created under a different node count do not keep
                  # double-booking storage (2 replicas on 1 node) or stay
                  # under-replicated after the cluster grows.
                  #
                  # Let op: numberOfReplicas is een getal. Een jsonpath-filter
                  # als [?(@.spec.numberOfReplicas!='2')] vergelijkt dat met een
                  # string en faalt met "incompatible types for comparison",
                  # waardoor deze stap eerder stil niets deed. Daarom hier
                  # ophalen en in de shell vergelijken.
                  kubectl -n storage get volumes.longhorn.io \
                    -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.numberOfReplicas}{"\n"}{end}' |
                  while read -r volume current; do
                    want="${TARGET_REPLICAS}"
                    case " ${EXCLUDED_VOLUMES} " in
                      *" ${volume} "*) want=1 ;;
                    esac
                    if [ "${current}" != "${want}" ]; then
                      echo "Volume ${volume}: ${current} -> ${want} replica('s)"
                      kubectl -n storage patch volume "${volume}" --type merge \
                        -p "{\"spec\":{\"numberOfReplicas\":${want}}}"
                    fi
                  done
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
