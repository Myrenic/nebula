apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-alloy
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./kubernetes/apps/monitoring/alloy/base
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Unchanged from the promtail Kustomization this replaces: nothing to collect
  # logs from until Loki exists, and a collector that starts first just holds a
  # queue it cannot deliver.
  dependsOn:
    - name: monitoring-loki
      namespace: flux-system
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: alloy
      namespace: monitoring
