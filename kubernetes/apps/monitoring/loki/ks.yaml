apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-loki
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./kubernetes/apps/monitoring/loki/base
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # The chart's PVC is Longhorn-backed. Without the dependency a first install
  # races the StorageClass: the StatefulSet stays Pending and the HelmRelease
  # reports failed instead of waiting once storage is up. kube-prometheus-stack
  # has the same gap (two Longhorn PVCs, no dependency) and is flagged rather
  # than changed here.
  dependsOn:
    - name: longhorn
      namespace: flux-system
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: loki
      namespace: monitoring
