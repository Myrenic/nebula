apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: filesystem
      limits_config:
        retention_period: 336h
      # retention_period above only marks data as deletable; without the
      # compactor doing the deleting, Loki keeps every chunk forever and the
      # 20Gi volume fills up. Loki's own default for retention_enabled is false.
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
        working_directory: /var/loki/compactor
    # Same load-bearing label as the Velero ServiceMonitor: Prometheus here selects
    # ServiceMonitors by `release: kube-prometheus-stack` (confirmed on the live
    # Prometheus CR, spec.serviceMonitorSelector.matchLabels), so a ServiceMonitor
    # without it is created, looks healthy and is never scraped.
    monitoring:
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        # 2 replicas, the same durability choice Prometheus and Alertmanager already
        # make. Loki's store here is a filesystem TSDB on this one PVC, so at the
        # 1-replica `longhorn` class a single disk loss takes 14 days of logs with it
        # - and the logs are the evidence of whatever failed. `longhorn` stays the
        # class for reclaimable data that is rebuilt rather than restored.
        #
        # storageClass is immutable on a StatefulSet's volumeClaimTemplate, so on an
        # existing release this needs the Loki StatefulSet deleted and `storage-loki-0`
        # removed before it takes effect - the StatefulSet reuses an existing PVC and
        # would otherwise keep reporting the old class.
        storageClass: longhorn-2-replicas
        accessModes:
          - ReadWriteOnce
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
