apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-blackbox-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.19.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    config:
      modules:
        # Named for what it checks: that a host is routed by Traefik, terminates TLS
        # and reaches a backend. It deliberately is not an HTTP 2xx check - most
        # hosts here sit behind the oauth2-proxy forwardAuth middleware and answer
        # 401/302 to anything anonymous, so a 2xx-only module marked six healthy
        # routes as failing and fired a critical alert for each, permanently.
        # A 5xx or a 404 still fails, which is the signal worth having.
        https_reachable:
          prober: http
          timeout: 10s
          http:
            method: GET
            preferred_ip_protocol: ip4
            fail_if_not_ssl: true
            valid_status_codes: [200, 301, 302, 401, 403]
