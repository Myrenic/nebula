apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-scaling-guidance
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # This file used to re-implement KubernetesNodeNotReady and
    # KubernetesNodePressure on top of kube_node_status_condition. The chart that
    # this Prometheus is installed from already ships both as KubeNodeNotReady and
    # KubeNodePressure, and its copies are the better ones: they exclude cordoned
    # nodes (kube_node_spec_unschedulable == 0), so a planned drain does not alert,
    # while the copies here fired on any node whose Ready condition was not True.
    # What is left is only the scaling guidance the chart does not provide.
    - name: cluster-capacity-guidance
      rules:
        - alert: ClusterOverprovisioned
          # The `unless` legs are Unknown handling, not decoration. A node whose
          # Ready condition is Unknown is not counted as ready by the selector
          # below, but its last CPU and memory samples are still in the sums, so
          # without this guard an unreachable node looks like spare capacity and
          # the alert says "scale down" at the moment the cluster is degrading.
          # `unless` over an empty right-hand side leaves the left side untouched,
          # which is what makes this correct when no node is Unknown.
          expr: |
            (
              count(kube_node_status_condition{condition="Ready",status="true"} == 1) > 1
              unless
              count(kube_node_status_condition{condition="Ready",status="unknown"} == 1) > 0
            )
            and
            (
              1 - (
                sum(rate(node_cpu_seconds_total{mode="idle"}[5m]))
                /
                sum(rate(node_cpu_seconds_total[5m]))
              )
            ) < 0.35
            and
            (
              1 - (
                sum(node_memory_MemAvailable_bytes)
                /
                sum(node_memory_MemTotal_bytes)
              )
            ) < 0.50
          for: 6h
          labels:
            severity: info
          annotations:
            summary: Cluster appears overprovisioned
            description: Ready nodes are greater than one while cluster CPU and memory stay low for 6 hours. Consider scaling down.
        - alert: SingleNodeHighUtilization
          expr: |
            (
              count(kube_node_status_condition{condition="Ready",status="true"} == 1) == 1
              unless
              count(kube_node_status_condition{condition="Ready",status="unknown"} == 1) > 0
            )
            and
            (
              (
                1 - (
                  sum(rate(node_cpu_seconds_total{mode="idle"}[5m]))
                  /
                  sum(rate(node_cpu_seconds_total[5m]))
                )
              ) > 0.85
              or
              (
                1 - (
                  sum(node_memory_MemAvailable_bytes)
                  /
                  sum(node_memory_MemTotal_bytes)
                )
              ) > 0.90
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Single-node cluster is highly utilized
            description: The only Ready node is under sustained CPU or memory pressure. Consider scaling up to at least 2 nodes.
