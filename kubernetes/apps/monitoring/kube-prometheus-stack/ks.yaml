apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-kube-prometheus-stack
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./kubernetes/apps/monitoring/kube-prometheus-stack/base
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
        optional: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Prometheus and Alertmanager both persist onto `longhorn-2-replicas`, so this
  # Kustomization has the same first-install race the Loki one had: without the
  # dependency both StatefulSets come up against a StorageClass that may not exist
  # yet and the HelmRelease reports failed instead of waiting for storage.
  dependsOn:
    - name: longhorn
      namespace: flux-system
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-kube-prometheus-stack-rules
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 1h
  retryInterval: 1m
  timeout: 2m
  prune: true
  path: ./kubernetes/apps/monitoring/kube-prometheus-stack/rules
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: monitoring-kube-prometheus-stack
