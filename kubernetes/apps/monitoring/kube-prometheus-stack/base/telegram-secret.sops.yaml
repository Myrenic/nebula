apiVersion: v1
kind: Secret
metadata:
    name: telegram-notification
    # Deliberately a second copy of flux-system/telegram-notification. The
    # Flux Alert provider reads its token from the secret in flux-system and
    # Alertmanager reads this one; neither can read across namespaces. The
    # namespace here is monitoring because that is where the HelmRelease
    # values mount it from - it previously said flux-system, which only worked
    # because Flux rewrites every object of this Kustomization to
    # targetNamespace: monitoring.
