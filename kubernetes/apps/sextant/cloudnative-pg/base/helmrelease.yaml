apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
      interval: 15m
  install:
    # The chart carries its CRDs in crds/, which Helm applies on install and
    # never on upgrade, so this is what carries a schema change - the same
    # reason longhorn sets it.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # The chart ships no resources by default, and an operator that reconciles
    # every Cluster in the cluster should not be the one pod with no ceiling.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
