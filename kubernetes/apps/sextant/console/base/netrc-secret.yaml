# The console commits to the overlay repository and the gate-runner clones it, so
# both need credentials for a private forge: a netrc file, which is what git reads
# and what the chart mounts (gitRemote.netrcSecret).
#
# One line inside the value, substituted whole from cluster-secrets, because the
# alternative - a placeholder on its own line of a YAML block scalar - is where
# this goes wrong: the substituted text keeps its own indentation level and the
# file stops parsing. A single-line netrc is read fine by the curl that git uses
# for HTTPS, with or without a trailing newline.
apiVersion: v1
kind: Secret
metadata:
  name: sextant-overlay-netrc
type: Opaque
stringData:
  netrc: "${SEXTANT_OVERLAY_NETRC}"
