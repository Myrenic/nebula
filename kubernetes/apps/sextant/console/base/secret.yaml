# The console's secrets, substituted from cluster-secrets by Flux's postBuild.
#
# Deliberately not a *.sops.yaml file next to this manifest: SOPS decryption is
# per-Kustomization (spec.decryption, which only the root and two others set), so
# an encrypted file under an app that forgets it is applied as ciphertext - which
# is exactly the state aiostreams' secret is in today.
apiVersion: v1
kind: Secret
metadata:
  name: sextant
type: Opaque
stringData:
  # Devices present this when they check in, and the agent carries the same value.
  SEXTANT_CHECKIN_TOKEN: "${SEXTANT_CHECKIN_TOKEN}"
  # Base64 of exactly 32 bytes. Seals typed secrets at rest, the escrowed LUKS
  # recovery keys among them; losing it makes every value sealed under it
  # unreadable (rotating means putting the new key first and keeping the old).
  SEXTANT_SECRET_KEY: "${SEXTANT_SECRET_KEY}"
  # Base64 of exactly 32 bytes. Seals session cookies, and the console refuses to
  # start with an OIDC issuer set and no session key.
  SEXTANT_SESSION_KEY: "${SEXTANT_SESSION_KEY}"
  SEXTANT_OIDC_CLIENT_SECRET: "${SEXTANT_OIDC_CLIENT_SECRET}"
  # Bearer token for the machine API.
  SEXTANT_API_TOKEN: "${SEXTANT_API_TOKEN}"
  # Two names for one value on purpose: the chart reads GATE_TOKEN out of this
  # secret and hands it to the console as SEXTANT_GATE_TOKEN, while the
  # gate-runner reads GATE_TOKEN itself. Both pods mount this one Secret, so
  # neither needs the value to appear twice here.
  GATE_TOKEN: "${SEXTANT_GATE_TOKEN}"
