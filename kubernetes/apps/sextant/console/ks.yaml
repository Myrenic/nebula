apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sextant
  namespace: flux-system
spec:
  targetNamespace: sextant
  interval: 1h
  retryInterval: 1m
  # The 5m default is wrong for a cold start here: two images have to be pulled,
  # the overlay cloned, and on the gate's first boot nixpkgs fetched before it
  # answers /healthz, which its startup probe allows five minutes for on its own.
  timeout: 15m
  prune: true
  path: ./kubernetes/apps/sextant/console/base
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  dependsOn:
    - name: longhorn
    - name: cloudnative-pg
  wait: true
