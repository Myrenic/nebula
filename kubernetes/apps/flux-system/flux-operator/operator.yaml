apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/controlplaneio-fluxcd/charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: flux-operator
      # Pinned so Renovate can see it: unpinned, Helm takes whatever the OCI
      # repository holds at the next reconcile, which is an upgrade nobody
      # reviewed and no pull request records.
      version: 0.60.0
      sourceRef:
        kind: HelmRepository
        name: flux-operator
  values:
    ui:
      enabled: true

