# Generated by flux, then edited by hand on 2026-10-02 when the source moved
# from GitHub to the forge. `flux bootstrap` is not run again; the only hand
# edit in here is the URL and its credential, and both live in git like
# everything else. See the "Where this repository lives" section in README.md.

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  # The forge is not in this cluster, on purpose: a cluster cannot host the git
  # service that stores its own configuration. It is the only reachable origin,
  # so it is the one Flux pulls from.
  #
  # The credential is a Secret in this namespace, not a deploy key here: SSH is
  # not reachable (the forge is only published on :443 through Cloudflare), so
  # this is HTTPS with a token. See flux-system-secret.sops.yaml, which is
  # applied by hand once per cluster because Flux needs it before it can fetch
  # anything at all.
  url: https://code.tuntelder.com/mtuntelder/nebula.git
  secretRef:
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
