# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./gotk-sync.yaml
# flux-system-secret.sops.yaml is intentionally NOT applied: kubectl/kustomize
# cannot decrypt SOPS at bootstrap time, and Flux needs this credential before
# it can fetch anything - the repository is private on the forge, which is what
# makes the credential necessary in the first place. Apply it by hand, once per
# cluster, after the age key exists:
#
#   sops -d kubernetes/apps/flux-system/flux-instance/flux-system-secret.sops.yaml \
#     | kubectl apply -f -
#
# It is kept in git, encrypted, so the rebuild does not depend on a token that
# only exists in someone's password manager - but it is the one secret here
# that Flux cannot deliver itself.
