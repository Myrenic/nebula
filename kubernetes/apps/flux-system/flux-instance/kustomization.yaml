apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-sync.yaml
# flux-system-secret.sops.yaml is intentionally NOT applied: kubectl/kustomize
# cannot decrypt SOPS at bootstrap time, and the repo is public (anonymous
# HTTPS clone). If the repo ever goes private, switch the GitRepository URL to
# ssh://git@github.com/myrenic/nebula and apply this secret manually after
# decrypting it with the age key.