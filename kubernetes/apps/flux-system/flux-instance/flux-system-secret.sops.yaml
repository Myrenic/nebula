# not-applied: the credential the GitRepository in gotk-sync.yaml uses to clone
# this repository from the forge. It cannot be applied by Flux - Flux needs it
# before it can fetch anything - so it is applied once by hand on a new cluster:
#
#   sops -d kubernetes/apps/flux-system/flux-instance/flux-system-secret.sops.yaml \
#     | kubectl apply -f -
#
# The token is the forge account's own access token, and it currently carries
# repository *write*. A pull mirror needs `read:repository` and nothing else:
# create such a token (forge -> user settings -> Applications), put it here,
# re-encrypt with `sops -e`, and re-apply. Until that is done, a compromise of
# this cluster also hands over write access to the repository that deploys it.
