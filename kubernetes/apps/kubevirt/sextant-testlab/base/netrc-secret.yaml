# The build job clones the fleet's overlay repository to build each device's
# disk image from it, and the repository is private. Same one-line netrc the
# console pushes with, substituted from cluster-secrets - the job is the only
# other reader.
apiVersion: v1
kind: Secret
metadata:
  name: sextant-overlay-netrc
type: Opaque
stringData:
  netrc: "${SEXTANT_OVERLAY_NETRC}"
