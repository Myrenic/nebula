# The disk store for the two test devices, and the smallest thing that can serve
# it. It is the same shape the workspace images use, and for the same reason: the
# CDI importer is a pod, so the disk has to be reachable from inside the cluster,
# and it does not have to be reachable from anywhere else. A multi-gigabyte qcow2
# through the ingress is a 413 from Cloudflare, and a per-boot pull from a public
# registry pays that path every time.
#
# RWX because the build job writes while this keeps serving - a rebuild must not
# need the server scaled down first.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sextant-testlab-images
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 12Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sextant-testlab-images
spec:
  replicas: 1
  # One writer (the build job, which mounts the same volume) - Recreate keeps a
  # half-written disk from ever being served by an old pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sextant-testlab-images
  template:
    metadata:
      labels:
        app: sextant-testlab-images
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          # The unprivileged variant: it is built to run as uid 101 with no
          # capabilities, which is what the pod security context below asks for.
          # The stock nginx image needs CAP_CHOWN to own its temp directories and
          # dies on `chown("/var/cache/nginx/client_temp", 101) failed` without
          # it - a container that is dropped to nothing cannot fix up its own
          # paths, so the image has to arrive that way.
          image: nginxinc/nginx-unprivileged:1.31-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: images
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            # TCP, not an HTTP GET of `/`: the store is empty until a disk has
            # been built into it, and nginx answers 403 to a directory with no
            # index - which would leave the pod permanently NotReady, drop it
            # from the Service's endpoints, and fail every CDI import with a
            # connection refused nobody expects.
            tcpSocket:
              port: http
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: sextant-testlab-images

---
apiVersion: v1
kind: Service
metadata:
  name: sextant-testlab-images
spec:
  selector:
    app: sextant-testlab-images
  ports:
    - name: http
      port: 80
      targetPort: http
