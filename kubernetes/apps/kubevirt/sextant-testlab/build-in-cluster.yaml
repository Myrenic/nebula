# not-applied: the disk-image build is a manual, occasional operation, not a
# reconciled resource. It has to run once per image revision, it needs KVM and
# eight gigabytes on a node, and re-running it is meaningless until the overlay
# moves - so Flux never applies it: `kubectl apply -f` it, watch it, and let the
# disks it writes be served by the PVC in base/images.yaml.
#
# The same shape as bouwstraat's build job, and for the same reason: nixpkgs'
# make-disk-image installs a bootloader by booting a small VM, so the derivation
# needs /dev/kvm. A workstation container does not have one; a KubeVirt node
# does. The store lives in the container's own writable layer, not a volume,
# and the result is copied onto the image volume: a nix store on a Longhorn
# volume produced hash mismatches in this cluster, and a fresh store per build
# costs a download rather than a lie.
#
# Node pinning is deliberately absent: the image volume is RWX, so the job and
# the nginx that serves it do not have to share a node.
apiVersion: batch/v1
kind: Job
metadata:
  name: sextant-testlab-build
  namespace: kubevirt
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sextant-testlab
        app.kubernetes.io/component: build
    spec:
      restartPolicy: Never
      containers:
        - name: build
          image: docker.io/nixos/nix:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux

              # kvm is not in nix's default system-features and the disk-image
              # step needs it; sandbox=false because a pod has no user namespace
              # for the nix sandbox, and the VM the image build boots is already
              # the isolation that matters here. max-jobs=auto because the
              # closure, the initrd and the disk image are separate derivations.
              export NIX_CONFIG='experimental-features = nix-command flakes
              system-features = benchmark big-parallel nixos-test kvm
              sandbox = false
              max-jobs = auto'

              # The overlay is private; its netrc is the console's, minus the
              # console. The nix image has no awk(1): the single netrc line is
              # split by the shell instead - machine host login user password
              # token, so the token is the sixth field.
              set -- $(cat /netrc/netrc)
              TOKEN="${6:?no password field in the netrc}"
              git clone --quiet "https://myrenic:${TOKEN}@code.tuntelder.com/myrenic/sextant-overlay.git" /work/overlay
              cd /work/overlay
              REV=$(git rev-parse HEAD)
              echo "building from overlay ${REV}"

              for dev in vm-test-1 vm-test-2; do
                nix build --no-link --print-out-paths \
                  ".#nixosConfigurations.${dev}.config.system.build.qcow2" | tee "/work/${dev}.path"
                disk="$(cat /work/${dev}.path)/nixos.qcow2"

                # Hash while writing: the write already crosses the share-manager,
                # and reading several gigabytes back out for a checksum is a
                # second trip for a number the write already had. The temp name
                # keeps a half-written disk from being served.
                tmp="/images/${dev}.qcow2.tmp"
                sha=$(cat "$disk" | tee "$tmp" | sha256sum | cut -d' ' -f1)
                mv "$tmp" "/images/${dev}.qcow2"
                chmod 0644 "/images/${dev}.qcow2"   # nginx runs as uid 101
                printf '%s  %s\n' "$sha" "/images/${dev}.qcow2" > "/images/${dev}.qcow2.sha256"
                # Provenance: which overlay revision this disk was built from, so
                # a running VM can be tied back to a commit without asking nix.
                printf '%s\n' "$REV" > "/images/${dev}.qcow2.rev"
                echo "${dev}: $(stat -c %s "/images/${dev}.qcow2") bytes, sha256 ${sha}"
              done

              # The importer reads from the volume, so the checksum that matters
              # is the one just written there.
              sync
              echo "TESTLAB-DISKS-REV ${REV}"
              echo "TESTLAB-READY"
          env:
            # Optional: leave unset to build the default branch's head.
            - name: REV
              value: ""
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
          securityContext:
            # The disk-image step boots a VM through /dev/kvm, which needs both.
            privileged: true
          volumeMounts:
            - name: kvm
              mountPath: /dev/kvm
            - name: images
              mountPath: /images
            - name: netrc
              mountPath: /netrc
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: images
          persistentVolumeClaim:
            claimName: sextant-testlab-images
        - name: netrc
          secret:
            secretName: sextant-overlay-netrc
        - name: work
          emptyDir:
            sizeLimit: 16Gi
