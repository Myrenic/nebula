apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt
  # This object is applied by two Kustomizations: this file (via the root
  # Kustomization) and the Namespace shipped inside the vendored operator bundle
  # (operator/base/operator.yaml, via kubevirt-operator). Two owners for one object
  # is not a style problem here - the bundle's PodSecurity label is what the
  # operator upstream expects, and this file adds the ones it lacks.
  #
  # The rule that matters: the value of pod-security.kubernetes.io/enforce MUST
  # stay identical to the bundle's, or the namespace flips between the two on every
  # reconcile and virt-handler/virt-launcher pods get rejected each time it lands
  # on the stricter value.
  #
  # To end up with a single owner, disable prune on the live object first and only
  # then drop one of the two manifests: Namespace deletion is not a no-op, it takes
  # every VM and its disks with it.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/managed-by: flux
    # KubeVirt requires privileged pods (virt-handler, virt-launcher).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
