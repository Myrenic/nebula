apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./operator
  - ./cdi
# The kubevirt and cdi Namespaces are not listed here: each operator bundle ships
# its own, and the operator Kustomization owns it. The extra labels those namespaces
# need (PodSecurity, the prune guard) are patched onto the bundle in
# operator/base/kustomization.yaml and cdi/base/kustomization.yaml, so there is
# exactly one owner per Namespace instead of two manifests fighting over the labels
# that PodSecurity reads.
