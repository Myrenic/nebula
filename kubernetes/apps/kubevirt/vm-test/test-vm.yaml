---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cirros-test
  namespace: kubevirt
  labels:
    app.kubernetes.io/name: cirros-test
    app.kubernetes.io/managed-by: flux
spec:
  running: false
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cirros-test
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 512Mi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        machine:
          type: q35
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 0
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: cirros-test
  dataVolumeTemplates:
    - metadata:
        name: cirros-test
      spec:
        source:
          http:
            url: https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-x86_64-disk.img
        pvc:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn
          resources:
            requests:
              storage: 1Gi
