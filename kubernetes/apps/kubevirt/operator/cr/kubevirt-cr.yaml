---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates: ["LiveMigration"]
    imagePullPolicy: IfNotPresent
    # Single-node: no live migration possible
    # PerpendicularLiveMigration is not needed
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy:
    # Single-node: batch migration is pointless
    batchMigrationCountdown: 0
    batchSilentRollbackInterval: 0
