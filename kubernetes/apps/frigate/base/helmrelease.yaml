apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: frigate
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      frigate:
        initContainers:
          # /config/config.yml is by default a read-only ConfigMap projection, so
          # frigate's own config editor (zones, masks) cannot write it. The
          # ConfigMap is mounted at /seed/config.yml and copied onto the /config
          # PVC once; from then on the live file is the one frigate edits and it
          # survives restarts. Re-lock by mounting the ConfigMap at
          # /config/config.yml again and dropping this init container.
          seed-config:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.18.0
            command:
              - sh
              - -c
              - |
                set -eu
                if [ ! -s /config/config.yml ]; then
                  cp /seed/config.yml /config/config.yml
                  echo "seeded /config/config.yml from the ConfigMap (missing or empty)"
                else
                  echo "/config/config.yml already present, keeping it"
                fi
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              # Deliberately not runAsNonRoot: it writes into the /config PVC,
              # which the image owns as root (there is no fsGroup on this pod,
              # because the main container needs the device nodes as they are).
              # It only reads one ConfigMap file and writes that file once, so
              # it needs no privilege to do it.
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.18.0
            env:
              LIBVA_DRIVER_NAME: iHD
              TZ: "${TZ}"
              # frigate expands {FRIGATE_*} placeholders inside config.yml from
              # its environment (frigate/config/env.py), so the MQTT login
              # lives in the cluster-secrets bundle and never in the
              # ConfigMap/git. config.yml carries {FRIGATE_MQTT_USERNAME} /
              # {FRIGATE_MQTT_PASSWORD} for the user/password fields.
              FRIGATE_MQTT_USERNAME: "${MQTT_USERNAME}"
              FRIGATE_MQTT_PASSWORD: "${MQTT_PASSWORD}"
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                # iGPU VRAM is shared system RAM; detector + enrichments
                # (YOLO-NAS, large face model, semantic search) + go2rtc all
                # allocate there. 2Gi OOM-killed the container.
                memory: 6Gi
            securityContext:
              # Frigate needs device access (iGPU render node) and privileged
              # helper processes; the official docs recommend privileged. A
              # privileged container is unconfined anyway - see the note where
              # the pod-level seccompProfile used to be - so nothing about its
              # capability set is narrowed here.
              #
              # readOnlyRootFilesystem is deliberately not set: the documented
              # writable paths (/config, /media/frigate, /dev/shm, /tmp/cache) are
              # all mounted, but the container is privileged and loads the iGPU
              # userspace from the image, and a read-only root has not been
              # verified for it. Guessing here would risk the recording path.
              privileged: true
            probes:
              # /api/version is frigate's own documented HTTP API endpoint
              # (GET /api/version) served on the internal port; the 8971 port in
              # the Service is Traefik's, not frigate's. The startup budget is
              # generous because the OpenVINO detector loads YOLO-NAS and the
              # face model from disk before the API answers, and liveness does
              # not begin until startup has passed.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 5000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 5000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 5000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
          reolinkproxy:
            # Translates Reolink's proprietary Baichuan protocol (TCP 9000)
            # into stable RTSP - the camera's own RTSP server is flaky with
            # concurrent clients. RTSP on :8556 (frigate's go2rtc already
            # binds 8554/8555 in the pod).
            image:
              repository: ghcr.io/shareed2k/reolinkproxy
              # Pinned to the newest release. The running container was built from
              # `latest`, whose digest matches no published tag, so this is the
              # first version this sidecar actually names.
              tag: v0.2.6
            env:
              REOLINK_CAMERA_0_NAME: frontdoor
              REOLINK_CAMERA_0_HOST: 10.0.50.209
              REOLINK_CAMERA_0_USERNAME: "${CAMERA_ADMIN_USERNAME}"
              REOLINK_CAMERA_0_PASSWORD: "${CAMERA_ADMIN_PASSWORD}"
              REOLINK_CAMERA_0_STREAM: main,sub,extern
              REOLINK_CAMERA_0_CHANNEL: "0"
              REOLINK_CAMERA_0_IDLE_DISCONNECT: "true"
              REOLINK_CAMERA_0_IDLE_TIMEOUT: "30s"
              REOLINK_SERVER_RTSP_ADDRESS: ":8556"
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              # The sidecar is not privileged - it only opens a TCP connection
              # to the camera - so it carries the standard non-root set instead
              # of inheriting the app container's privilege.
              #
              # No readOnlyRootFilesystem: unlike searxng, spottarr and
              # uptime-kuma, this sidecar was not run against a read-only root,
              # so its write paths are unknown and are left as they are.
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /usr/local/bin/reolinkproxy
                      - healthcheck
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 3
    defaultPodOptions:
      annotations:
        # The one volume in this namespace that is not worth an off-site copy:
        # `media` is ~70 GiB of camera recordings against ~11 GiB for everything
        # else in auth+services combined. Excluding it by name (rather than
        # selecting the apps that *are* backed up) keeps the backup fail-open:
        # a container added later is protected by default, and this line is the
        # only thing that has to be reconsidered when it is not wanted.
        #
        # The frigate namespace has to be listed in the velero schedules in
        # kubernetes/apps/backup for this annotation to matter at all.
        backup.velero.io/backup-volumes-excludes: media
      # Frigate needs an Intel iGPU for VA-API/QSV (LIBVA_DRIVER_NAME=iHD); the
      # third machine is a Proxmox VM with no /dev/dri render node it can use.
      # The label is the i915 extension those two machines install through
      # omni/cluster-template.yaml, so it is a property of git rather than of a
      # node labeller that could stop writing it.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: extensions.talos.dev/i915
                    operator: Exists
      # No pod-level seccompProfile, unlike every other app. The app container is
      # privileged, and the kubelet does not apply a seccomp profile to a
      # privileged container - it runs unconfined whatever is written here. A
      # RuntimeDefault at pod level therefore described something this pod never
      # got, and the two unprivileged containers that do need it (seed-config,
      # reolinkproxy) set their own.
    service:
      app:
        controller: frigate
        ports:
          http:
            port: 8971
          http-internal:
            port: 5000
          rtsp:
            port: 8554
          webrtc-tcp:
            port: 8555
          webrtc-udp:
            port: 8555
            protocol: UDP
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: frigate-config
        globalMounts:
          # seed only - see the seed-config init container above. Restore
          # `path: /config/config.yml` to make the ConfigMap authoritative again.
          - path: /seed/config.yml
            subPath: config.yml
      media:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 50Gi
        globalMounts:
          - path: /media/frigate
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      tmp-cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp/cache
      dri:
        type: hostPath
        hostPath: /dev/dri
        hostPathType: Directory
        globalMounts:
          - path: /dev/dri
