<!-- The nebula mark, the same drawing the forge and the landing pages carry
     (kubernetes/apps/services/forgejo/base/theme/). Login is the one page a
     person sees before the cluster, so it is the same mark here, used as a mask
     in nebula.css: the shape comes from this file, the colour from the theme,
     which is what keeps one file usable as ink on a light page and as ink on a
     dark one. -->
