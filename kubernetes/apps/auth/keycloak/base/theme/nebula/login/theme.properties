# The `nebula` login theme: what the cluster's sign-in pages look like.
#
# It is a child of `keycloak.v2` - the PatternFly 5 theme this Keycloak ships -
# and it inherits every template from it untouched. Only the properties below are
# ours, so a keycloak upgrade moves the markup and the pages keep working; the
# rules in resources/css/nebula.css are written against classes the engine itself
# sets (item 6 of the theme properties), not against markup we would have to copy.
#
# parent: keycloak.v2, not `keycloak`. `keycloak` is the older PatternFly 3/4
# login theme; keycloak.v2 is the current one, with a template per page, form
# helpers (field.ftl) and prefers-color-scheme support that the stylesheet here
# builds on.
parent=keycloak.v2

# common/keycloak carries the PatternFly vendor bundle (stylesCommon) and the
# fonts the templates reference. Declared here as well as in the parent because
# resourcesCommonPath, which every page is built against, is derived from this
# line: inheriting it would work today and would break silently the day the parent
# stops importing it.
import=common/keycloak

# A child theme's `styles` replaces the parent's list rather than adding to it,
# so the parent's own layout sheet is named again here, followed by ours - which
# then loads last and wins every conflict.
styles=css/styles.css css/nebula.css

# The engine's own script reads this and puts `pf-v5-theme-dark` on <html> when
# the browser asks for dark. nebula.css keys its colour set off that class rather
# than off a media query, so the two cannot disagree.
darkMode=true
