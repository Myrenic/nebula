apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
spec:
  interval: 1h
  dependsOn:
    - name: keycloak-postgres
  chartRef:
    kind: OCIRepository
    name: keycloak
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      keycloak:
        containers:
          app:
            image:
              repository: quay.io/keycloak/keycloak
              tag: 26.7.4
            args:
              - start
            env:
              KC_DB: postgres
              KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
              KC_DB_USERNAME: keycloak
              KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
              KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME}"
              KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
              KC_HOSTNAME: "https://keycloak.${SECRET_DOMAIN_0}"
              KC_HOSTNAME_STRICT: "true"
              KC_PROXY_HEADERS: xforwarded
              KC_HTTP_ENABLED: "true"
              # Theme resources are served with a cache header, and the URL they
              # are served from does not change when a stylesheet does (measured
              # against 26.7.4: the /resources/<key>/... segment is stable across a
              # theme edit and a restart). At the default, 30 days, a browser that
              # has loaded the sign-in page once keeps the old stylesheet for a
              # month; ten minutes is short enough that a theme change shows up on
              # the next visit and long enough that the PatternFly bundle still
              # comes from cache the rest of the time.
              KC_SPI_THEME_STATIC_MAX_AGE: "600"
              KC_HEALTH_ENABLED: "true"
              KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "true"
              KC_HTTP_MANAGEMENT_SCHEME: http
              TZ: "${TZ}"
            resources:
              requests:
                cpu: 250m
                memory: 768Mi
              limits:
                memory: 2Gi
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/started
                    port: 9000
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: 9000
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: 9000
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: keycloak
        ports:
          http:
            port: 8080
    persistence:
      # The sign-in theme. Keycloak reads a theme from disk as a directory tree -
      # login/theme.properties, with the stylesheet and images under
      # login/resources/ - and a ConfigMap is flat, so its three files are mounted
      # one at a time onto the paths that tree needs. Mounting the ConfigMap whole
      # would flatten this into a directory of three loose files, and a subPath
      # mount of the theme directory would hide the rest of /opt/keycloak/themes.
      #
      # The theme is inert until a realm names it (`loginTheme: nebula`); that
      # setting is hand-made with the rest of the realm - see README.md.
      theme:
        type: configMap
        name: keycloak-theme
        globalMounts:
          - path: /opt/keycloak/themes/nebula/login/theme.properties
            subPath: theme.properties
            readOnly: true
          - path: /opt/keycloak/themes/nebula/login/resources/css/nebula.css
            subPath: nebula.css
            readOnly: true
          - path: /opt/keycloak/themes/nebula/login/resources/img/nebula-mark.svg
            subPath: nebula-mark.svg
            readOnly: true
