apiVersion: v1
kind: Namespace
metadata:
  name: auth
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Keycloak, its Postgres and oauth2-proxy all run as ordinary pods with
    # dropped capabilities (verified against the running pods), so this
    # namespace does not need to be exempt from the baseline policy.
    pod-security.kubernetes.io/enforce: baseline
