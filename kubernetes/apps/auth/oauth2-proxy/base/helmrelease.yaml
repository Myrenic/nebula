apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
spec:
  interval: 1h
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.4.3
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: oauth2-proxy
    replicaCount: 2
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    service:
      portNumber: 80
    config:
      # Client id/secret/cookie-secret live in the out-of-band
      # keycloak-webui-oauth Secret (created manually, like arc-github-auth),
      # so they don't need to be in SOPS.
      existingSecret: keycloak-webui-oauth
    extraArgs:
      provider: oidc
      oidc-issuer-url: "https://keycloak.${SECRET_DOMAIN_0}/realms/chacdn"
      oidc-email-claim: "email"
      oidc-groups-claim: "groups"
      redirect-url: "https://auth.${SECRET_DOMAIN_0}/oauth2/callback"
      cookie-domain: ".${SECRET_DOMAIN_0}"
      whitelist-domain: ".${SECRET_DOMAIN_0}"
      set-xauthrequest: "true"
      reverse-proxy: "true"
      email-domain: "*"
      cookie-secure: "true"
      custom-templates-dir: "/templates"
      scope: "openid email profile"
    extraVolumes:
      - name: custom-templates
        configMap:
          name: oauth2-proxy-templates
    extraVolumeMounts:
      - name: custom-templates
        mountPath: /templates
        readOnly: true
