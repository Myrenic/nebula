name: gitleaks

# Secret scan, and a required status check on the default branch (branch
# protection), so a pull request that introduces a credential cannot merge.
#
# Three Forgejo specifics are handled here:
#   * the runner does not check the repository out (unlike GitHub), so the job
#     fetches it itself;
#   * it fetches the commit that triggered the run (`GITHUB_SHA`) - a plain
#     `git clone` would always scan the default branch and wave a secret
#     through on a pull request;
#   * the fetch happens inside the gitleaks image, which ships git, so there is
#     no checkout action and nothing pulled from GitHub's CDN, which this WAN
#     drops.
#
# `gitleaks dir` scans the fetched tree - the files as they would land - which
# is fast enough to gate every push. It does not walk old history: a secret
# already in a repository's past cannot be un-leaked, it has to be rotated and
# purged, and no scan changes that.

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: self-hosted
    container:
      image: zricethezav/gitleaks:v8.30.1
    steps:
      - name: scan
        run: |
          set -eu
          host="${GITHUB_SERVER_URL#*://}"
          echo "scanning ${GITHUB_REPOSITORY}@${GITHUB_SHA} from ${host}"
          git init --quiet src
          git -C src remote add origin "http://oauth2:${GITHUB_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
          git -C src fetch --quiet --depth 1 origin "${GITHUB_SHA}"
          git -C src checkout --quiet FETCH_HEAD
          echo "files: $(git -C src ls-files | wc -l)"
          gitleaks dir --redact --verbose --exit-code 1 src
