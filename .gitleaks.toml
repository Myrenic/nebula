[extend]
# Keep the built-in rule set; a config file otherwise replaces it entirely.
useDefault = true

# Allowlists for this repository. Keep every entry narrow and say why.
[[allowlists]]
description = "The Keycloak chart's JDBC URL, read as a credential by generic-api-key"
regexes = ['''jdbc:postgresql://[a-z0-9-]+:[0-9]+/[a-z0-9_]+''']
targetRules = ["generic-api-key"]

[[allowlists]]
description = "SOPS-encrypted files: the values are ciphertext, the Secret shape is not"
paths = ['''\.sops\.ya?ml$''']
targetRules = ["kubernetes-secret-yaml"]
