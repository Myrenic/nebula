# Cilium on Talos v1.13.x, with kube-proxy still enabled.
#
# These values follow the Talos guide for Cilium. The three things that differ
# from the default on Talos:
#   1. cgroupv2 and bpffs are already mounted by Talos -> Cilium must not do that
#      itself (cgroup.autoMount.enabled=false).
#   2. Workloads may not load kernel modules -> SYS_MODULE has to be out of the
#      capability set, otherwise the agent does not start.
#   3. IPAM on 'kubernetes', so Cilium uses the per-node podCIDR that
#      kube-controller-manager already hands out. That keeps the podCIDR equal to
#      what Flannel uses now.
ipam:
  mode: kubernetes

# kube-proxy keeps taking care of service routing. Cilium only does pod
# networking and NetworkPolicy here. Switching to kube-proxy-free later is
# possible, but that is a second change and you do not want it at the same time
# as this one.
kubeProxyReplacement: false

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Required on Talos: Talos forwards kube-dns to the host DNS, and that collides
# with Cilium's eBPF host routing. Without this rule CoreDNS does not work and
# DNS falls over cluster-wide.
bpf:
  hostLegacyRouting: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Hubble added so you can see what passes by. During the audit phase (policies
# logging instead of blocking) this is the most important tool. The UI stays off;
# you can port-forward to it later.
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
