# Omni cluster template for cluster `talos-default`.
#
# This is the source of truth for the cluster. Changes belong here, not on the
# nodes: Omni resets the machine config to what is in this file.
#
# Apply from the root of the repo (the manifest path is relative to this file):
#
#   omnictl cluster template sync --file omni/cluster-template.yaml
#
# NOTE: a change to the machine config makes the machines reboot.
#
# The three machines are not equal:
#   340932a1-…  Proxmox VM (talos.platform=nocloud), 1 disk, no NVMe
#   4c4c4544-004c-…  bare metal (Dell), has /dev/nvme0n1
#   4c4c4544-0053-…  bare metal (Dell), has /dev/nvme0n1
#
# That is why the NVMe patch sits on the two Machine documents and not on the
# control-plane set: on the VM it points at a disk that is not there, and that
# keeps the node down.
kind: Cluster
name: talos-default
kubernetes:
  # Keep these equal to what the machines actually run - check with
  # `kubectl get nodes -o wide` - because Omni resets the machine config to this
  # template, and a number that lags reality means a sync tries to take a
  # running cluster backwards. They read v1.36.3 / v1.13.8 until 2026-10-02,
  # while the cluster was already on v1.37.0 / v1.14.1; that is the drift this
  # comment exists to prevent. Upgrade the numbers here deliberately, then sync.
  #
  # Omni holds the live spec and can be ahead of git, so reconcile before
  # syncing rather than after:
  #
  #   omnictl cluster template diff --file omni/cluster-template.yaml
  version: v1.37.0
  manifests:
    # Cilium is the CNI. Flannel is turned off by the patch below.
    # one-time: Omni applies this once; Cilium manages itself after that - which
    # also means a regenerated cilium/cilium-install.yaml does NOT reach the
    # cluster on its own. Upgrading Cilium is `./generate.sh`, then applying the
    # new manifest to the running cluster by hand (`kubectl apply -f`), and only
    # a fresh machine gets the new file from here. See docs/cluster.md.
    - name: cilium
      file: cilium/cilium-install.yaml
      mode: one-time
talos:
  version: 1.14.2
---
kind: ControlPlane
machines:
  - 340932a1-baea-49ac-8bc0-282a554e87e6
  - 4c4c4544-004c-4810-805a-b3c04f514433
  - 4c4c4544-0053-5a10-8054-c7c04f333933
patches:
  - idOverride: 400-talos-default-control-planes-untaint
    inline: |
      cluster:
        allowSchedulingOnControlPlanes: true
  # Flannel out, Cilium in its place (see the manifests above).
  # Talos v1.13 still uses this form; from v1.14 it is
  # kind: KubeFlannelCNIConfig with $patch: delete.
  - idOverride: 600-disable-flannel-cni
    inline: |
      cluster:
        network:
          cni:
            name: none
---
kind: Workers
---
# Proxmox VM: deliberately no NVMe patch, that disk does not exist here.
kind: Machine
name: 340932a1-baea-49ac-8bc0-282a554e87e6
---
kind: Machine
systemExtensions:
  - siderolabs/i915
  - siderolabs/intel-ucode
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
name: 4c4c4544-004c-4810-805a-b3c04f514433
patches:
  - idOverride: 500-nvme-longhorn2-baremetal-1
    inline: |
      machine:
        disks:
          - device: /dev/nvme0n1
            partitions:
              - size: 0
                mountpoint: /var/mnt/longhorn2
---
kind: Machine
name: 4c4c4544-0053-5a10-8054-c7c04f333933
patches:
  - idOverride: 500-nvme-longhorn2-baremetal-2
    inline: |
      machine:
        disks:
          - device: /dev/nvme0n1
            partitions:
              - size: 0
                mountpoint: /var/mnt/longhorn2
