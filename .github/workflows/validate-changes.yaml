name: Validate Changes

# Runs the gate suite on a push to main and on human pull requests. Dependency pull
# requests are covered by validate-renovate.yaml instead, because a pull_request run
# raised by GITHUB_TOKEN is held as `action_required` and would need a click.
#
# The gates themselves live in scripts/validate.sh so that "checked" means one
# thing. Run it locally with:  scripts/validate.sh
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.editorconfig'
      - '.sops.yaml'
      - '.yamllint'
      - 'kubernetes/**'
      - 'omni/**'
      - 'README.md'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.editorconfig'
      - '.sops.yaml'
      - '.yamllint'
      - 'kubernetes/**'
      - 'omni/**'
      - 'README.md'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: validate-changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3

      # Pinned so CI uses the same releases a maintainer installs locally.
      - name: Install yamllint and kubeconform
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install --quiet yamllint==1.38.0
          echo "$RUNNER_TEMP/yamllint/bin" >>"$GITHUB_PATH"
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Validate
        run: scripts/validate.sh
