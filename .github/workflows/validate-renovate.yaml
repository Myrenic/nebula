name: Validate Renovate

# Checks the branches Renovate proposes, in the repository's own context, without
# anybody approving a workflow run.
#
# Why not `pull_request`: a PR opened with GITHUB_TOKEN gets its pull_request runs
# held as `action_required` - GitHub waits for a human click before starting them.
# For an automatic dependency flow that is the same as having no CI at all, and it
# is why these checks are driven by workflow_run instead: that event is not held.
#
# Each branch is validated as main + that branch, with scripts/validate.sh - the
# same gates a hand-written change gets - and the result is reported as a
# `renovate/validate` commit status on the branch head. A branch is marked pending
# before it is checked, so a validator that dies halfway leaves the branch pending
# rather than looking green.
#
# scripts/check-renovate-branches.sh runs validate.sh from THIS checkout (the
# trusted revision) with the branch worktree as its root, and validate.sh resolves
# its helper scripts relative to itself - so the gates always come from the trusted
# revision and only the manifests come from the branch under test.
on:
  workflow_run:
    workflows: [Renovate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read # read the branches
  statuses: write # report renovate/validate

concurrency:
  group: validate-renovate
  cancel-in-progress: true

jobs:
  branches:
    name: Renovate branches
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA with the version in a trailing comment: a tag is
      # mutable, and this action runs with the repository's contents and token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the script fetches and walks the renovate refs

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.3

      # Same pins and same published-digest verification as validate-changes.yaml:
      # whatever decides whether a manifest passes is a fixed artefact.
      - name: Install yamllint
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/yamllint"
          YAMLLINT_VERSION=1.38.0
          meta="$(curl -sSfL "https://pypi.org/pypi/yamllint/${YAMLLINT_VERSION}/json" \
            | python3 -c 'import json,sys; u=json.load(sys.stdin)["urls"]; w=[x for x in u if x["filename"].endswith("-py3-none-any.whl")][0]; print(w["digests"]["sha256"], w["url"])')"
          yamllint_wheel="$RUNNER_TEMP/$(basename "$(printf '%s' "$meta" | cut -d' ' -f2)")"
          curl -sSfL -o "$yamllint_wheel" "$(printf '%s' "$meta" | cut -d' ' -f2)"
          echo "$(printf '%s' "$meta" | cut -d' ' -f1)  $yamllint_wheel" | sha256sum -c -
          "$RUNNER_TEMP/yamllint/bin/pip" install --quiet "$yamllint_wheel"
          echo "$RUNNER_TEMP/yamllint/bin" >>"$GITHUB_PATH"

      - name: Install kubeconform
        run: |
          set -euo pipefail
          # The file name is kept as the release publishes it: the digest in
          # CHECKSUMS is the one for that name, and sha256sum -c reads it from there.
          curl -sSfL -o "$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/CHECKSUMS" \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/CHECKSUMS
          (cd "$RUNNER_TEMP" && grep '^[0-9a-f]*  kubeconform-linux-amd64\.tar\.gz$' CHECKSUMS | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Mark every branch pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/check-renovate-branches.sh --list | while IFS=$'\t' read -r branch sha; do
            [ -n "${branch:-}" ] || continue
            echo "pending: $branch"
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state=pending \
              -f context=renovate/validate \
              -f description="validating" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          done

      - name: Validate every branch
        run: scripts/check-renovate-branches.sh --out "$RUNNER_TEMP/branches.tsv"

      - name: Report the results as commit statuses
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/branches.tsv" ]; then
            echo "::error::no branch results were produced; branches stay pending"
            exit 1
          fi
          failed=0
          while IFS=$'\t' read -r branch sha state detail; do
            [ -n "${branch:-}" ] || continue
            if [ "$state" = PASS ]; then status=success; else status=failure; failed=1; fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state="$status" \
              -f context=renovate/validate \
              -f description="$(printf '%s' "$detail" | cut -c1-130)" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          done <"$RUNNER_TEMP/branches.tsv"
          exit "$failed"
